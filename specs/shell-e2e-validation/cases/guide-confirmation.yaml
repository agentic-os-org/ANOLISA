version: 1
suite: guide-confirmation
defaults:
  execution: ci
  adapter: cosh-core
  shell: bash
  real_provider: false
  terminal_cols: 100
  terminal_rows: 32
  timeout_ms: 60000
cases:
  - id: GUIDE-CONFIRMATION-CANCEL-EN
    title: Login and history import default to cancel and preserve the source action without writing
    tags: [shell, guide, confirmation, cancel, read-only]
    command:
      - env
      - TERM=xterm-256color
      - COSH_SHELL_LANG=en-US
      - bash
      - --noprofile
      - --norc
      - -c
      - >-
        account_before=$(getent passwd "$(id -un)");
        config_before=$(sha256sum "$HOME/.copilot-shell/config.toml" 2>/dev/null || true);
        /usr/bin/cosh guide;
        guide_status=$?;
        test "$guide_status" -eq 0 || exit "$guide_status";
        test "$account_before" = "$(getent passwd "$(id -un)")" || exit 41;
        test "$config_before" = "$(sha256sum "$HOME/.copilot-shell/config.toml" 2>/dev/null || true)" || exit 42;
        printf 'ACCOUNT_AND_CONFIG_UNCHANGED\n'
    input:
      - {type: wait_for, text: "Enter", timeout_ms: 15000}
      - {type: bytes, hex: "1b5b42"}
      - {type: key, name: enter}
      - {type: wait_for, text: "UID", timeout_ms: 10000}
      - {type: key, name: enter}
      - {id: login-confirm-default-cancel, type: wait_quiet, quiet_ms: 700, timeout_ms: 10000}
      - {type: key, name: enter}
      - {id: login-cancel-restores-source, type: wait_quiet, quiet_ms: 600, timeout_ms: 10000}
      - {type: key, name: enter}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: bytes, hex: "1b5b421b5b421b5b421b5b42"}
      - {type: key, name: enter}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: bytes, hex: "1b5b42"}
      - {type: key, name: enter}
      - {type: wait_quiet, quiet_ms: 600, timeout_ms: 10000}
      - {type: bytes, hex: "1b5b421b5b42"}
      - {type: key, name: enter}
      - {id: import-confirm-default-cancel, type: wait_quiet, quiet_ms: 700, timeout_ms: 10000}
      - {type: key, name: enter}
      - {id: import-cancel-restores-source, type: wait_quiet, quiet_ms: 600, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 400, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 400, timeout_ms: 10000}
      - {type: key, name: esc}
    expect:
      status: 0
      contains: ["UID", "Confirm", "Cancel", "redaction", "ACCOUNT_AND_CONFIG_UNCHANGED"]
      not_contains: ["password for", "panicked", "Traceback"]
    evidence:
      points:
        - {id: login-confirm-default-cancel, trigger_event: login-confirm-default-cancel, layout_sensitive: true, required_types: [screenshot]}
        - {id: login-cancel-restores-source, trigger_event: login-cancel-restores-source, layout_sensitive: true, required_types: [screenshot]}
        - {id: import-confirm-default-cancel, trigger_event: import-confirm-default-cancel, layout_sensitive: true, required_types: [screenshot]}
        - {id: import-cancel-restores-source, trigger_event: import-cancel-restores-source, layout_sensitive: true, required_types: [screenshot]}
