        text: HEALTH_BANNER_DONE
        timeout_ms: 10000
      - id: banner-settled
        type: wait_quiet
        quiet_ms: 600
        timeout_ms: 5000
      - type: line
        text: exit
    expect:
      status: 0
      contains: ["健康检查", HEALTH_BANNER_DONE]
      not_contains: [Traceback, "thread 'main' panicked"]
    evidence:
      points:
        - id: banner-settled
