  - id: HEALTH-LOGIN-40-EN
    title: Installed profile prints live health facts before the first Bash prompt (40 columns, en-US)
    tags: [shell, bash, health, banner, login, installed, visual]
    terminal_cols: 40
    command:
      - /usr/bin/env
      - COSH_SHELL_LANG=en-US
      - COSH_SHELL_HEALTH_SCAN=1
      - COSH_SHELL_WIDTH=40
      - TERM=xterm-256color
      - "PROMPT_COMMAND=printf '\\nHEALTH_LOGIN_READY\\n'"
      - /bin/bash
      - --login
      - -i
    input:
      - id: startup-ready
        type: wait_for
        text: HEALTH_LOGIN_READY
        timeout_ms: 10000
      - id: login-settled
        type: wait_quiet
        quiet_ms: 600
