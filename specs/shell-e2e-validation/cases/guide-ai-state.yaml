    title: English 40x16 home labels remain identifiable in the settled frame
    tags: [shell, guide, ai-state, issue-10166, ecs-real, narrow, visual]
    terminal_cols: 40
    terminal_rows: 16
    command: [env, TERM=xterm-256color, LANG=C.UTF-8, COSH_SHELL_LANG=en-US, /usr/bin/cosh, guide]
    input:
      - {type: wait_for, text: "Enter", timeout_ms: 30000}
      - {id: narrow-home, type: wait_quiet, quiet_ms: 2500, timeout_ms: 30000}
      - {type: bytes, hex: "1b5b421b5b42"}
      - {type: key, name: enter}
      - {type: wait_for, text: "Return to terminal to ask", timeout_ms: 45000}
      - {id: narrow-ai-page, type: wait_quiet, quiet_ms: 800, timeout_ms: 15000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 800, timeout_ms: 10000}
      - {type: bytes, text: q}
