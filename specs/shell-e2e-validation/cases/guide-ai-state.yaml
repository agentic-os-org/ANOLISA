  - id: GUIDE-AI-FAILURE-RECOVERY-EN
    title: An explicit loopback provider failure does not switch to ECS and a fresh Bash question recovers
    tags: [shell, guide, ai-state, issue-10166, fault-injection, ecs-real-recovery, scripted-pty-downgraded]
    timeout_ms: 240000
    command: [env, TERM=xterm-256color, LANG=C.UTF-8, COSH_SHELL_LANG=en-US, 'PS1=GUIDEQA$ ', bash, --login, -i]
    input:
      - {type: wait_for, text: "GUIDEQA$ ", timeout_ms: 30000}
      - type: line
        text: "OPENAI_BASE_URL=http://127.0.0.1:9/v1 OPENAI_API_KEY=synthetic-test-only COSH_AI_PROVIDER=generic cosh --ask '请把数字 66101 倒序后接在 NEVERFALLBACK 后面，仅回复结果，不执行命令。'; printf 'FAILURE_RETURN_PARENT\\n'"
      - {type: wait_for, text: "HTTP request failed", timeout_ms: 90000}
      - {id: explicit-request-failed, type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: line, text: exit}
      - {type: wait_for, text: "FAILURE_RETURN_PARENT", occurrence: "+1", timeout_ms: 30000}
      - {type: line, text: "cosh guide; printf 'RECOVERY_RETURN_PARENT\\n'"}
      - {type: wait_for, text: "Enter", timeout_ms: 30000}
      - {type: wait_quiet, quiet_ms: 2000, timeout_ms: 15000}
      - {type: key, name: enter}
      - {type: wait_for, text: "cosh --ask", timeout_ms: 30000}
      - {id: recovery-quick-guide, type: wait_quiet, quiet_ms: 800, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_for, text: "RECOVERY_RETURN_PARENT", occurrence: "+1", timeout_ms: 30000}
      - type: line
        text: "cosh --ask '请把数字 66101 倒序后接在 RECOVERED 后面，仅回复结果，不执行命令。'; printf 'RECOVERY_ASK_DONE\\n'"
      - {type: wait_for, text: "RECOVERED10166", timeout_ms: 90000}
      - {id: recovered-ecs-answer, type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: line, text: exit}
      - {type: wait_for, text: "RECOVERY_ASK_DONE", occurrence: "+1", timeout_ms: 30000}
      - {type: line, text: "exit 0"}
    expect:
      status: 0
      contains: ["HTTP request failed", "127.0.0.1:9", "RECOVERED10166", "RECOVERY_RETURN_PARENT"]
      not_contains: ["NEVERFALLBACK10166", "Waiting for activation", "EcsTrialDisabled"]
    evidence:
