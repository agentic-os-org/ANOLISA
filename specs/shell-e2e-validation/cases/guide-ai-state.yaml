  - id: GUIDE-AI-DISABLED-EN
    title: An explicit automatic-access opt-out is distinct from missing configuration
    tags: [shell, guide, ai-state, issue-10166, synthetic-preferences]
    command:
      - bash
      - -c
      - |
        set -eu
        case_home=$(mktemp -d /tmp/cosh-guide-disabled-XXXXXX)
        trap 'rm -rf "$case_home"' EXIT
        install -d -m 700 "$case_home/.copilot-shell/cosh"
        state_file="$case_home/.copilot-shell/cosh/preferences.toml"
        printf 'version = 1\n[ecs_trial]\nauto_use = false\n' > "$state_file"
        chmod 600 "$state_file"
        before=$(sha256sum "$state_file")
        env TERM=xterm-256color LANG=C.UTF-8 COSH_SHELL_LANG=en-US HOME="$case_home" /usr/bin/cosh guide
        test "$before" = "$(sha256sum "$state_file")"
        printf '\nREADONLY_STATE_OK\n'
    input:
      - {type: wait_for, text: "Enter", timeout_ms: 30000}
      - {type: wait_quiet, quiet_ms: 2500, timeout_ms: 15000}
      - {type: bytes, hex: "1b5b421b5b42"}
      - {type: key, name: enter}
      - {type: wait_for, text: "See how to ask", timeout_ms: 45000}
      - {id: disabled-state, type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: key, name: esc}
      - {type: wait_quiet, quiet_ms: 500, timeout_ms: 10000}
      - {type: bytes, text: q}
    expect:
      status: 0
      contains: ["Automatic ECS access is off", "READONLY_STATE_OK"]
      not_contains: ["Not configured", "Unable to read AI access status", "Return to terminal to ask"]
    evidence:
      points:
        - {id: disabled-state, trigger_event: disabled-state, layout_sensitive: true, required_types: [screenshot]}
