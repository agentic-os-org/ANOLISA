  - id: GUIDE-AI-FIRST-ASK-ZH
    title: First user-initiated ask completes via ECS trial without manual configuration
    tags: [shell, guide, ai-state, issue-10166, ecs-real, scripted-pty-downgraded]
    command:
      - env
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - COSH_SHELL_LANG=zh-CN
      - "PS1=GUIDEQA$ "
      - bash
      - --login
      - -i
    input:
      - type: wait_for
        text: "GUIDEQA$ "
        timeout_ms: 30000
      - type: line
        text: "cosh --ask '请只回复 PONGOK10166 这个词，不要执行任何命令。'; printf 'RETURN_PARENT_BASH\\n'"
      - type: wait_for
        text: "╭ Agent"
        timeout_ms: 90000
      - id: actual-answer
        type: wait_quiet
        quiet_ms: 500
        timeout_ms: 15000
      - type: line
        text: "exit"
      - type: wait_for
        text: "RETURN_PARENT_BASH"
        timeout_ms: 30000
        occurrence: "+1"
      - id: returned-parent
        type: wait_quiet
        quiet_ms: 300
        timeout_ms: 10000
      - type: line
        text: "exit 0"
    expect:
      status: 0
      contains:
        - "PONGOK10166"
        - "RETURN_PARENT_BASH"
      not_contains:
        - "等待开通"
        - "Waiting for activation"
        - "No model configured"
        - "ModelNotConfigured"
