[package]
name = "cosh-shell"
version.workspace = true
edition.workspace = true
description = "Shell-first interactive Agent shell for cosh-ng"
readme = "README.md"
license.workspace = true
repository.workspace = true
keywords = ["shell", "agent", "terminal", "approval", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cosh-shell"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true, features = ["clock", "serde"] }
nix = { workspace = true, features = ["dir", "fs", "signal", "term"] }
ratatui = "0.28"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
# Anonymous temp files for guarded executor output capture; already used
# by cosh-cli, cosh-core, and cosh-platform on the same major line.
tempfile = "3"
toml.workspace = true
uuid.workspace = true
wait-timeout.workspace = true
qrcode = { version = "0.14", default-features = false }
# Display-column accounting for native candidate echo (#1721); already in
# the dependency graph via ratatui, pinned to the resolved 0.1.x line.
unicode-width = "0.1"
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
vt100 = { workspace = true }
