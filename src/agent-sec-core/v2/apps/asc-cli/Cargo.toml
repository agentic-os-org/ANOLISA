[package]
name = "asc-cli"
description = "Daemon-only AgentSecCore CLI with Policy, Scope, Binding, and code scanning"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agent-sec-cli"
path = "src/main.rs"

[dependencies]
asc-action-types = { workspace = true }
dirs = { workspace = true }
rustix = { workspace = true }
asc-observability = { workspace = true, features = ["runtime"] }
tracing.workspace = true
asc-daemon-client = { workspace = true }
asc-daemon-protocol = { workspace = true }
asc-foundation-types = { workspace = true }
asc-policy-types = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-properties = { workspace = true }

[dev-dependencies]
asc-capability-skill-sec = { workspace = true }
asc-security-events = { workspace = true }
asc-action-runtime = { workspace = true, features = ["testing"] }
tokio = { workspace = true }
asc-daemon = { workspace = true }
asc-daemon-core = { workspace = true }
asc-daemon-handler = { workspace = true }
asc-daemon-service = { workspace = true }
asc-pap = { workspace = true }
asc-pap-repository-memory = { workspace = true }
asc-policy-engine = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
