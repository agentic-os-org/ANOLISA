# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = [
    "apps/asc-cli",
    "apps/asc-daemon",
    "crates/action/asc-action-runtime",
    "crates/action/asc-action-types",
    "crates/action/capabilities/asc-capability-code-scan",
    "crates/action/capabilities/asc-capability-skill-guard",
    "crates/daemon/asc-daemon-client",
    "crates/daemon/asc-daemon-core",
    "crates/daemon/asc-daemon-handler",
    "crates/daemon/asc-daemon-protocol",
    "crates/daemon/asc-daemon-service",
    "crates/data/asc-event-log",
    "crates/data/asc-event-sink",
    "crates/data/asc-observability",
    "crates/data/asc-security-events",
    "crates/data/asc-security-summary",
    "crates/data/persistence/asc-persistence-sqlite",
    "crates/data/persistence/asc-sqlite-kernel",
    "crates/foundation/asc-foundation-types",
    "crates/integrations/asc-agentsight-client",
    "crates/policy/adapters/asc-policy-adapter-agentsight",
    "crates/policy/asc-pap",
    "crates/policy/asc-pap-repository-memory",
    "crates/policy/asc-pcp",
    "crates/policy/asc-policy-runtime",
    "crates/policy/asc-policy-engine",
    "crates/policy/asc-policy-target-contracts",
    "crates/policy/asc-policy-types",
    "crates/policy/asc-policy-repository",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/alibaba/anolisa"
publish = false

[workspace.dependencies]
asc-policy-runtime = { path = "crates/policy/asc-policy-runtime" }
asc-action-runtime = { path = "crates/action/asc-action-runtime" }
asc-action-types = { path = "crates/action/asc-action-types" }
asc-agentsight-client = { path = "crates/integrations/asc-agentsight-client" }
asc-capability-code-scan = { path = "crates/action/capabilities/asc-capability-code-scan" }
asc-capability-skill-guard = { path = "crates/action/capabilities/asc-capability-skill-guard" }
asc-daemon = { path = "apps/asc-daemon" }
asc-daemon-client = { path = "crates/daemon/asc-daemon-client" }
asc-daemon-core = { path = "crates/daemon/asc-daemon-core" }
asc-daemon-handler = { path = "crates/daemon/asc-daemon-handler" }
asc-daemon-protocol = { path = "crates/daemon/asc-daemon-protocol" }
asc-daemon-service = { path = "crates/daemon/asc-daemon-service" }
asc-event-log = { path = "crates/data/asc-event-log" }
asc-event-sink = { path = "crates/data/asc-event-sink" }
asc-foundation-types = { path = "crates/foundation/asc-foundation-types" }
asc-observability = { path = "crates/data/asc-observability" }
asc-pap = { path = "crates/policy/asc-pap" }
asc-pap-repository-memory = { path = "crates/policy/asc-pap-repository-memory" }
asc-pcp = { path = "crates/policy/asc-pcp" }
asc-persistence-sqlite = { path = "crates/data/persistence/asc-persistence-sqlite" }
asc-policy-adapter-agentsight = { path = "crates/policy/adapters/asc-policy-adapter-agentsight" }
asc-policy-engine = { path = "crates/policy/asc-policy-engine" }
asc-policy-target-contracts = { path = "crates/policy/asc-policy-target-contracts" }
asc-policy-repository = { path = "crates/policy/asc-policy-repository" }
asc-policy-types = { path = "crates/policy/asc-policy-types" }
asc-security-events = { path = "crates/data/asc-security-events" }
asc-security-summary = { path = "crates/data/asc-security-summary" }
asc-sqlite-kernel = { path = "crates/data/persistence/asc-sqlite-kernel" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
fancy-regex = "0.16"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
socket2 = "0.6"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-properties = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
yaml-rust2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
