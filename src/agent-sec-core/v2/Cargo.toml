# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = [
    "apps/asc-cli",
    "apps/asc-daemon",
    "crates/asc-action-runtime",
    "crates/asc-action-types",
    "crates/asc-capability-code-scan",
    "crates/asc-capability-prompt-scan",
    "crates/asc-model-client",
    "crates/asc-daemon-client",
    "crates/asc-daemon-core",
    "crates/asc-daemon-handler",
    "crates/asc-daemon-protocol",
    "crates/asc-daemon-service",
    "crates/asc-event-log",
    "crates/asc-event-sink",
    "crates/asc-observability",
    "crates/asc-security-events",
    "crates/asc-telemetry",
    "crates/asc-security-summary",
    "crates/asc-persistence-sqlite",
    "crates/asc-sqlite-kernel",
    "crates/asc-foundation-types",
    "crates/asc-agentsight-client",
    "crates/asc-policy-adapter-agentsight",
    "crates/asc-pap",
    "crates/asc-pap-repository-memory",
    "crates/asc-pcp",
    "crates/asc-policy-runtime",
    "crates/asc-policy-engine",
    "crates/asc-policy-target-contracts",
    "crates/asc-policy-types",
    "crates/asc-policy-repository",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/alibaba/anolisa"
publish = false

[workspace.dependencies]
asc-policy-runtime = { path = "crates/asc-policy-runtime" }
asc-action-runtime = { path = "crates/asc-action-runtime" }
asc-action-types = { path = "crates/asc-action-types" }
asc-agentsight-client = { path = "crates/asc-agentsight-client" }
asc-capability-code-scan = { path = "crates/asc-capability-code-scan" }
asc-capability-prompt-scan = { path = "crates/asc-capability-prompt-scan" }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "json"] }
percent-encoding = "2"
url = "2"
asc-daemon = { path = "apps/asc-daemon" }
asc-daemon-client = { path = "crates/asc-daemon-client" }
asc-daemon-core = { path = "crates/asc-daemon-core" }
asc-daemon-handler = { path = "crates/asc-daemon-handler" }
asc-daemon-protocol = { path = "crates/asc-daemon-protocol" }
asc-daemon-service = { path = "crates/asc-daemon-service" }
asc-event-log = { path = "crates/asc-event-log" }
asc-event-sink = { path = "crates/asc-event-sink" }
asc-foundation-types = { path = "crates/asc-foundation-types" }
asc-model-client = { path = "crates/asc-model-client" }
asc-observability = { path = "crates/asc-observability" }
asc-pap = { path = "crates/asc-pap" }
asc-pap-repository-memory = { path = "crates/asc-pap-repository-memory" }
asc-pcp = { path = "crates/asc-pcp" }
asc-persistence-sqlite = { path = "crates/asc-persistence-sqlite" }
asc-policy-adapter-agentsight = { path = "crates/asc-policy-adapter-agentsight" }
asc-policy-engine = { path = "crates/asc-policy-engine" }
asc-policy-target-contracts = { path = "crates/asc-policy-target-contracts" }
asc-policy-repository = { path = "crates/asc-policy-repository" }
asc-policy-types = { path = "crates/asc-policy-types" }
asc-security-events = { path = "crates/asc-security-events" }
asc-telemetry = { path = "crates/asc-telemetry" }
asc-security-summary = { path = "crates/asc-security-summary" }
asc-sqlite-kernel = { path = "crates/asc-sqlite-kernel" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
fancy-regex = "0.16"
log = "0.4"
nix = { version = "0.31", default-features = false, features = ["user"] }
regex = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
serde_yaml = "0.9"
serial_test = "3"
socket2 = "0.6"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1"
unicode-properties = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
uuid = { version = "1", features = ["v4"] }
yaml-rust2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
