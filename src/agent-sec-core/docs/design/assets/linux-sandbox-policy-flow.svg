<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" role="img" aria-labelledby="title desc">
<title id="title">AgentSecCore：运行时输入、策略决策与执行</title>
<desc id="desc">用户或管理端创建策略基线，意图识别模块依据任务与当前状态生成动态策略，两类输入汇入 PAP，统一经过接入校验、管理绑定和组合发布；动态策略在基线约束下生效。PDP 加载生效策略。PEP 通过 Hook、CLI 或 Gateway 捕获本次输入并准备申请权限，可携带已有检测结果。现有 daemon 中的 PDP 授权入口按需组织 scanner/PIP 检测，包括意图偏移检测。Cedar 授权与 advice 处理在统一核心内形成五态决策。PEP 通过 Hook、linux-sandbox 等方式实施。STEP_UP 由 Hook 通过 ask 请求人工确认，用户通过后直接放行，无需再次提交 PDP 审批。获准且约束落实后执行目标并回报结果。</desc>
<defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#718197"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#326a9c"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7653ab"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#37827d"/></marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #23354d; }
      .title { font-size: 40px; font-weight: 650; letter-spacing: -0.4px; }
      .section { font-size: 32px; font-weight: 650; }
      .heading { font-size: 28px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 22px; } .caption { font-size: 20px; } .strong { font-weight: 600; }
      .muted { fill: #64758b; }
      .purple { fill: #6c499d; }
      .blue { fill: #326a9c; }
      .teal { fill: #337c77; }
      .state { font-family: "SFMono-Regular", Consolas, monospace; font-size: 23px; font-weight: 600; }
      .line { fill: none; stroke: #718197; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#gray); }
      .request { fill: none; stroke: #326a9c; stroke-width: 3; stroke-linecap: round; marker-end: url(#blue); }
      .decision { fill: none; stroke: #7653ab; stroke-width: 3; stroke-linecap: round; marker-end: url(#purple); }
      .query { fill: none; stroke: #37827d; stroke-width: 3; stroke-linecap: round; marker-end: url(#teal); }
    </style>
  </defs>

<rect width="1800" height="1290" fill="#ffffff"/>
