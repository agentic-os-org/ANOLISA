sensitive_file_paths:
  - /etc/shadow
  - /etc/gshadow
  - ~/\.ssh
  - /etc/ssh\b
  - ~/\.gnupg
  - \.env\b
  - /etc/machine-id
  - /etc/passwd
  - /etc/sudoers
  - /etc/pam\.d\b
  - /etc/security\b
  - /etc/sysctl\.conf
  - /etc/sysctl\.d\b
  - /boot\b
  - /usr/lib/systemd\b
  - /etc/systemd/system\b
  - /etc/group
  - /etc/hostname
  - /etc/hosts
  - /etc/crontab
  - /etc/cron\.d\b
  - /var/spool/cron\b
  - ~/\.bash_history
  - ~/\.zsh_history
  - /etc/kubernetes\b
  - kubeconfig
  # Agent runtime credential and auth state files.
  - ~/\.codex/auth\.json\b
  - ~/\.hermes/auth\.json\b
  - ~/\.hermes/\.env\b
  - ~/\.hermes/config\.yaml\b
  - ~/\.hermes/profiles/[^/]+/auth\.json\b
  - ~/\.hermes/profiles/[^/]+/\.env\b
  - ~/\.hermes/profiles/[^/]+/config\.yaml\b
  - ~/\.openclaw/openclaw\.json\b
  - ~/\.openclaw/agents/[^/]+/agent/models\.json\b
  - ~/\.copilot-shell/settings\.json\b
  - ~/\.copilot-shell/aliyun_creds\.json\b
  - ~/\.copilot-shell/mcp-oauth-tokens(-v2)?\.json\b
