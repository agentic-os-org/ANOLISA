[package]
name = "semantic-arbiter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Agent-independent model judgments and deterministic evidence checking"
publish = false

[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
sha2 = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
rustix = { version = "1.1", features = ["fs", "event"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rustix = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
