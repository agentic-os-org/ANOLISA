# Install matching AW, Providers and SDKs, then replace these deployment paths.
# Both targets share all Hook policy. Claude uses its explicit resident bootstrap.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata: {name: resident-sdk}
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: auto}
  execution: {guarantee: native_hook, default_event_budget_ms: 5000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    pi:
      adapter: pi
      argv: [node, /opt/application/pi-worker.mjs]
    claude:
      adapter: claude-sdk
      argv: [/opt/application/venv/bin/python, -m, aw_claude, --, -m, application]
  providers:
    custom:
      transport:
        type: stdio
        location: agent
        argv: [/opt/application/venv/bin/python, /opt/application/aw-hook.py]
      timeout_ms: 1000
      max_output_bytes: 4096
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [/opt/aw/bin/aw-provider-sec-core, --cli, /opt/aw/bin/agent-sec-cli, --socket, /run/agent-sec-core/daemon.sock]
      timeout_ms: 2000
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        tools:
          bash: {language: bash, input_pointer: /command}
    tokenless:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [/opt/aw/bin/aw-provider-tokenless, --cli, /opt/aw/bin/tokenless, --data-dir, /var/lib/aw/tokenless]
      timeout_ms: 2000
      max_output_bytes: 1048576
      config: {version: 1}
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - {id: custom-before, provider: custom, effects: [observe, block], on_error: block}
        - {id: security, provider: security, operation: scan_code, effects: [observe, block], on_error: block}
        - {id: tokenless-pre, provider: tokenless, operation: pre_tool, effects: [block], on_error: block}
    tool.after:
      enabled: true
      required: true
      steps:
        - {id: custom-after, provider: custom, effects: [observe], on_error: report}
        - {id: tokenless-post, provider: tokenless, operation: post_tool, effects: [replace_result], on_error: report}
