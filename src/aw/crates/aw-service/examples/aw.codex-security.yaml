# Replace executable and socket paths before use. Start the sec-core daemon separately.
# Install the three AW hooks once with `aw install`, then review them in Codex `/hooks`.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata: {name: codex-security}
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: auto}
  execution: {guarantee: native_hook, default_event_budget_ms: 5000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    codex:
      adapter: codex
      argv: [/absolute/path/to/codex]
  providers:
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [/absolute/path/to/aw-provider-sec-core, --cli,
               /absolute/path/to/agent-sec-cli, --socket,
               /absolute/path/to/sec-core.sock]
      timeout_ms: 2500
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        unmapped_tool: error
        prompt: {mode: block, scan_mode: fast}
        pii: {input_mode: block, output_mode: replace_result}
        tools:
          Bash: {language: bash, input_pointer: /command}
  events:
    input.submit:
      enabled: true
      required: true
      steps:
        - {id: prompt, provider: security, operation: scan_prompt,
           effects: [observe, block], on_error: block}
        - {id: user-pii, provider: security, operation: scan_user_input,
           effects: [observe, block], on_error: block}
    tool.before:
      enabled: true
      required: true
      steps:
        - id: code
          provider: security
          operation: scan_code
          effects: [observe, block]
          on_error: block
        - id: tool-pii
          provider: security
          operation: scan_tool_input
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      steps:
        - {id: completion, provider: security, operation: observe_tool,
           effects: [observe], on_error: report}
        - {id: output-pii, provider: security, operation: scan_tool_output,
           effects: [observe, replace_result], on_error: withhold_result}
