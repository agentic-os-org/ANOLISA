# Verified Pi Coding Agent/Core baselines: 0.84.2, 1.3.0, 1.5.2; Node.js >=22.19.0.
# Managed runWorker factory.
# Replace executable/socket/application paths and start sec-core separately.
# One Pi target: input, shell-tool and final tool-output checks.
# Sign/authorize Skill directories before using /skill:name.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: pi-submission
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: auto}
  execution: {guarantee: native_hook, default_event_budget_ms: 5000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    pi:
      adapter: pi
      argv: [node, /absolute/pi-worker.mjs]
  providers:
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv:
          - /absolute/path/to/aw-provider-sec-core
          - --cli
          - /absolute/path/to/agent-sec-cli
          - --socket
          - /absolute/path/to/sec-core.sock
      timeout_ms: 2500
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        skill: true
        prompt: {mode: block, scan_mode: fast}
        pii: {input_mode: block, output_mode: replace_result}
        tools:
          bash: {language: bash, input_pointer: /command}
  events:
    input.submit:
      enabled: true
      required: true
      steps:
        - id: skill
          provider: security
          operation: check_skill
          effects: [observe, block]
          on_error: block
        - id: prompt
          provider: security
          operation: scan_prompt
          effects: [observe, block]
          on_error: block
        - id: user-pii
          provider: security
          operation: scan_user_input
          effects: [observe, block]
          on_error: block
    tool.before:
      enabled: true
      required: true
      steps:
        - id: tool-input
          provider: security
          operation: scan_tool_input
          match: {tools: ['native:pi:bash']}
          effects: [observe, block]
          on_error: block
        - id: shell-code
          provider: security
          operation: scan_code
          match: {tools: ['native:pi:bash']}
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      required: true
      steps:
        - id: tool-output
          provider: security
          operation: scan_tool_output
          effects: [observe, replace_result]
          on_error: withhold_result
