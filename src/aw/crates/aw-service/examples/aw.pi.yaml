# Pi Coding Agent/Core 0.84.2 public SDK worker, Node.js >=22.19.0.
# application.mjs exports createSession({sdk,args}) and run(session,{args,createSession}).
# This neutral command demonstrates both hook points, not a security policy.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: pi-sdk-hooks
spec:
  daemon:
    startup: on_demand
    endpoint: auto
    state_dir: auto
  execution:
    guarantee: native_hook
    default_event_budget_ms: 5000
  audit:
    enabled: true
    payload: metadata_only
  agents:
    pi:
      adapter: pi
      argv: [node, /absolute/pi-application.mjs]
  providers:
    neutral:
      transport:
        type: stdio
        location: agent
        argv: [/bin/sh, -c, 'cat >/dev/null; printf false']
      timeout_ms: 2000
      max_output_bytes: 32
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - id: before
          provider: neutral
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      required: true
      steps:
        - id: after
          provider: neutral
          effects: [observe]
          on_error: report
