# DeepSeek Harness 0.2.1-rc.5 verified on Linux with the headless profile.
# Replace paths and choose the profile used by the application. Keep the model,
# credentials and native permissions in DSH_HOME; sec-core must be running.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: deepseek-security
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: auto}
  execution: {guarantee: native_hook, default_event_budget_ms: 10000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    dsh:
      adapter: deepseek-harness
      argv: [/absolute/path/to/dsh, --profile, headless]
  providers:
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv:
          - /absolute/path/to/aw-provider-sec-core
          - --cli
          - /absolute/path/to/agent-sec-cli
          - --socket
          - /run/agent-sec-core/daemon.sock
      timeout_ms: 4500
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        prompt: {mode: block, scan_mode: fast}
        pii: {input_mode: block, output_mode: replace_result}
        tools:
          execute_shell_command: {language: bash, input_pointer: /command}
  events:
    input.submit:
      enabled: true
      required: true
      steps:
        - id: prompt
          provider: security
          operation: scan_prompt
          effects: [observe, block]
          on_error: block
        - id: pii-user
          provider: security
          operation: scan_user_input
          effects: [observe, block]
          on_error: block
    tool.before:
      enabled: true
      required: true
      steps:
        - id: pii-input
          provider: security
          operation: scan_tool_input
          effects: [observe, block]
          on_error: block
        - id: scan-code
          provider: security
          operation: scan_code
          match: {tools: ['native:deepseek-harness:execute_shell_command']}
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      required: true
      steps:
        - id: pii-output
          provider: security
          operation: scan_tool_output
          effects: [observe, replace_result]
          on_error: report
    security.violation:
      enabled: true
      required: true
      steps:
        - id: final-pii
          provider: security
          operation: check_final_tool_output
          effects: [observe, block]
          on_error: block
