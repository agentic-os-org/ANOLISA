# Replace absolute paths. Install @deepseek-ai/dsh@0.2.1-rc.2 and keep its model
# configuration in DSH_HOME. PreTool also requires RTK on the native PATH.
# The public Rust V2 agent-sec-cli requires an existing sec-core daemon.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: deepseek-tool-lifecycle
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: /absolute/path/to/aw-state}
  execution: {guarantee: native_hook, default_event_budget_ms: 5000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    deepseek:
      adapter: deepseek-harness
      argv: [/absolute/path/to/dsh, --profile, headless]
  providers:
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [/absolute/path/to/aw-provider-sec-core, --cli, /absolute/path/to/agent-sec-cli, --socket, /run/agent-sec-core/daemon.sock]
      timeout_ms: 2000
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        # Map every code-executing native/custom tool that requires scanning.
        tools:
          bash: {language: bash, input_pointer: /command}
    tokenless:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv: [/absolute/path/to/aw-provider-tokenless, --cli, /absolute/path/to/tokenless, --data-dir, /absolute/path/to/tokenless-state]
      timeout_ms: 2000
      max_output_bytes: 1048576
      config: {version: 1}
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - id: scan-code
          provider: security
          operation: scan_code
          effects: [observe, block]
          on_error: block
        - id: rewrite-command
          provider: tokenless
          operation: pre_tool
          effects: [block]
          on_error: report
    tool.after:
      enabled: true
      required: true
      steps:
        - id: observe-completion
          provider: security
          operation: observe_tool
          effects: [observe]
          on_error: report
        - id: compress-result
          provider: tokenless
          operation: post_tool
          effects: [replace_result]
          on_error: report
