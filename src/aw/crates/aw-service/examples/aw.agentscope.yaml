# Run from src/aw using a Python environment with agentscope==2.0.6 installed.
# Replace python3 with that environment's absolute Python path when necessary.
# No model credentials or network are used by the demo worker.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: agentscope-public-factory
spec:
  daemon:
    startup: on_demand
    endpoint: auto
    state_dir: auto
  execution:
    guarantee: native_hook
    default_event_budget_ms: 5000
  audit:
    enabled: true
    payload: metadata_only
  agents:
    agentscope:
      adapter: agentscope
      argv: [python3, crates/aw-service/examples/agentscope_demo.py]
  providers:
    before-match:
      transport:
        type: stdio
        location: agent
        argv: [/bin/sh, -c, 'cat >/dev/null; printf false']
      timeout_ms: 2000
      max_output_bytes: 4096
    after-match:
      transport:
        type: stdio
        location: agent
        argv: [/bin/sh, -c, 'cat >/dev/null; printf true']
      timeout_ms: 2000
      max_output_bytes: 4096
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - id: gate
          provider: before-match
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      required: true
      steps:
        - id: record
          provider: after-match
          effects: [observe]
          on_error: report
