# Replace all absolute path placeholders; native profiles and model credentials stay external.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: shared-tool-optimization
spec:
  daemon:
    startup: on_demand
    endpoint: auto
    state_dir: /absolute/path/to/aw-state
  execution:
    guarantee: native_hook
    default_event_budget_ms: 5000
  audit:
    enabled: true
    payload: metadata_only
  agents:
    qoder:
      adapter: qoder
      argv: [/absolute/path/to/qodercli]
    openclaw:
      adapter: openclaw
      argv: [/absolute/path/to/node, /absolute/path/to/openclaw.mjs, gateway, run]
    qwenpaw:
      adapter: qwenpaw
      argv: [/absolute/path/to/qwenpaw, app]
    hermes:
      adapter: hermes
      argv: [/absolute/path/to/hermes, chat]
    pi:
      adapter: pi
      argv: [/absolute/path/to/node, /absolute/path/to/pi-application.mjs]
  providers:
    tokenless:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv:
          - /absolute/path/to/aw-provider-tokenless
          - --cli
          - /absolute/path/to/tokenless
          - --data-dir
          - /absolute/path/to/tokenless-state
      timeout_ms: 2000
      max_output_bytes: 1048576
      config:
        version: 1
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - id: rewrite-command
          provider: tokenless
          operation: pre_tool
          effects: [block]
          on_error: report
    tool.after:
      enabled: true
      required: true
      steps:
        - id: compress-result
          provider: tokenless
          operation: post_tool
          effects: [replace_result]
          on_error: report
