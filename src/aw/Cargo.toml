[workspace]
members = [
    "crates/aw-cli",
    "crates/aw-adapter",
    "crates/aw-contracts",
    "crates/aw-config",
    "crates/aw-core",
    "crates/aw-exec",
    "crates/aw-host",
    "crates/aw-provider",
    "crates/aw-service",
    "crates/aw-package",
]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive", "string"] }
clap_complete = "4.6.0"
aw-package = { path = "crates/aw-package" }
aw-adapter = { path = "crates/aw-adapter" }
flate2 = "1"
tar = "0.4"
tempfile = "3"
aw-service = { path = "crates/aw-service" }
aw-config = { path = "crates/aw-config" }
aw-core = { path = "crates/aw-core" }
aw-contracts = { path = "crates/aw-contracts" }
aw-exec = { path = "crates/aw-exec" }
aw-host = { path = "crates/aw-host" }
aw-provider = { path = "crates/aw-provider" }
jsonschema = { version = "0.53", default-features = false }
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
shlex = "1"

# Package acceptance repeatedly hashes real executables; keep that bounded work
# practical in debug builds while retaining development checks in AW code.
[profile.dev.package.sha2]
opt-level = 3
