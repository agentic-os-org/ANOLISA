[workspace]
members = [
    ".",
    "crates/aw-config",
    "crates/aw-core",
    "crates/aw-exec",
    "crates/aw-provider",
]
resolver = "2"

[workspace.dependencies]
aw-config = { path = "crates/aw-config" }
aw-contracts = { path = "." }
jsonschema = { version = "0.53", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"

[package]
name = "aw-contracts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned AW capability contracts and offline conformance validation"
repository = "https://github.com/alibaba/anolisa"
publish = false

[dependencies]
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
