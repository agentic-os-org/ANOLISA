[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "anolisa-aw-sdk-claude"
version = "0.2.1"
description = "Optional Claude Agent SDK integration for anolisa-aw-sdk"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = ["Operating System :: POSIX :: Linux", "Typing :: Typed"]
dependencies = ["anolisa-aw-sdk==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aw_sdk_claude = ["py.typed"]
