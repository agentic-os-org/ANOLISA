[workspace]
members = ["."]
resolver = "3"

[workspace.dependencies]
asc-daemon-client = { path = "../../../agent-sec-core/v2/crates/asc-daemon-client", version = "=1.0.1" }
tokenless-runtime = { path = "../../../tokenless/crates/tokenless-runtime", version = "=0.8.7" }
tokenless-protocol = { path = "../../../tokenless/crates/tokenless-protocol", version = "=0.8.7" }
thiserror = "2"
serde_json = "1"
tempfile = "3"

[package]
name = "aw-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Typed application access to ANOLISA security and Tokenless"

[features]
default = ["sec-core", "tokenless"]
sec-core = ["dep:asc-daemon-client"]
tokenless = ["dep:tokenless-runtime", "dep:tokenless-protocol"]

[dependencies]
asc-daemon-client = { workspace = true, optional = true }
tokenless-runtime = { workspace = true, optional = true }
tokenless-protocol = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "application"
required-features = ["sec-core", "tokenless"]
