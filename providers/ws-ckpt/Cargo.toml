[package]
name = "aw-provider-ws-ckpt"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[dependencies]
aw-provider = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[workspace]
resolver = "2"

[workspace.dependencies]
aw-provider = { path = "../../src/aw/crates/aw-provider" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
