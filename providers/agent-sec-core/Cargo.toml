[package]
name = "aw-provider-sec-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AW Provider bridge to the public sec-core scan-code CLI"
publish = false

[dependencies]
aw-exec = { workspace = true }
aw-provider = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
jsonschema = { workspace = true }

[workspace]
resolver = "2"

[workspace.dependencies]
aw-exec = { path = "../../src/aw/crates/aw-exec" }
aw-provider = { path = "../../src/aw/crates/aw-provider" }
jsonschema = { version = "0.53", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
