# Linux SDK/App example. Replace paths; initialize QWENPAW_WORKING_DIR for the App.
apiVersion: aw/v1alpha1
kind: AWConfiguration
metadata:
  name: tool-pii-policy
spec:
  daemon: {startup: on_demand, endpoint: auto, state_dir: auto}
  execution: {guarantee: native_hook, default_event_budget_ms: 5000}
  audit: {enabled: true, payload: metadata_only}
  agents:
    sdk:
      adapter: qoder-sdk
      argv: [node, /absolute/path/to/worker.mjs]
    app:
      adapter: qwenpaw
      argv: [qwenpaw, app]
  providers:
    security:
      protocol: aw-provider/v1alpha1
      transport:
        type: stdio
        location: agent
        argv:
          - /absolute/path/to/aw-provider-sec-core
          - --cli
          - /absolute/path/to/agent-sec-cli
          - --socket
          - /run/agent-sec-core/daemon.sock
      timeout_ms: 4500
      max_output_bytes: 4096
      config:
        version: 1
        mode: block
        pii: {input_mode: block, output_mode: replace_result}
        tools:
          bash: {language: bash, input_pointer: /command}
          execute_shell_command: {language: bash, input_pointer: /command}
  events:
    tool.before:
      enabled: true
      required: true
      steps:
        - id: pii-input
          provider: security
          operation: scan_tool_input
          effects: [observe, block]
          on_error: block
        - id: scan-code
          provider: security
          operation: scan_code
          match: {tools: ['native:qoder-sdk:Bash', 'native:qwenpaw:execute_shell_command']}
          effects: [observe, block]
          on_error: block
    tool.after:
      enabled: true
      required: true
      steps:
        - id: pii-output
          provider: security
          operation: scan_tool_output
          effects: [observe, replace_result]
          on_error: withhold_result
