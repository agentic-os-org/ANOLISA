[package]
name = "aw-provider-semantic-arbiter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Observe-only AW Provider for explicit task-scope semantic shadow evaluation"
publish = false

[workspace]
resolver = "2"

[workspace.dependencies]
aw-provider = { path = "../../src/aw/crates/aw-provider" }
semantic-arbiter = { path = "../../src/semantic-arbiter" }
aw-host = { path = "../../src/aw/crates/aw-host" }
aw-config = { path = "../../src/aw/crates/aw-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
tempfile = "3"

[dependencies]
aw-provider = { workspace = true }
semantic-arbiter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
aw-host = { workspace = true }
aw-config = { workspace = true }
