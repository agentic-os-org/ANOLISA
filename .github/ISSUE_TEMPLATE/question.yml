name: Question
description: Ask for help using or understanding ANOLISA
labels: ["type:question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask a focused question and tell us what you have already tried.
        Questions remain available here until GitHub Discussions is enabled.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Optional hint only. Leave this unanswered when the boundary is unclear.
      options:
        - anolisa
        - tokenless
        - cosh-ng
        - cosh
        - skillfs
        - sight
        - sec-core
        - memory
        - ckpt
        - skill
        - project-wide
        - not sure
        - other
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Include the goal, the command or workflow, and where you became blocked.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Optional commands, documentation links, logs, or screenshots.
