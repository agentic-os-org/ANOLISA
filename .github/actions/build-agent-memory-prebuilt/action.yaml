name: Build agent-memory prebuilt package
description: Build and package one agent-memory release target on the release Cross runner.

inputs:
  version:
    description: Component version without the v prefix.
    required: true
  target-os:
    description: Package target operating system.
    required: true
  target-arch:
    description: Package target architecture.
    required: true
  profile:
    description: Prepared Cross release profile.
    required: true
  tag:
    description: Release tag to bind to the checked-out commit. Empty for previews.
    required: false
    default: ''

outputs:
  artifact-directory:
    description: Directory containing the tar, checksums, and CycloneDX SBOM.
    value: ${{ steps.build.outputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Select Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-node@v4
      with:
        node-version: '22.23.2'

    - name: Build precompiled package
      id: build
      shell: bash
      env:
        AGENT_MEMORY_OUTPUT_DIR: ${{ runner.temp }}/agent-memory-prebuilt-${{ inputs.target-os }}-${{ inputs.target-arch }}
        AGENT_MEMORY_VERSION: ${{ inputs.version }}
        AGENT_MEMORY_TARGET_OS: ${{ inputs.target-os }}
        AGENT_MEMORY_TARGET_ARCH: ${{ inputs.target-arch }}
        AGENT_MEMORY_PROFILE: ${{ inputs.profile }}
        AGENT_MEMORY_TAG: ${{ inputs.tag }}
      run: |
        "$GITHUB_ACTION_PATH/build.sh" \
          --source-repo "$GITHUB_WORKSPACE" \
          --output-dir "$AGENT_MEMORY_OUTPUT_DIR" \
          --version "$AGENT_MEMORY_VERSION" \
          --target-os "$AGENT_MEMORY_TARGET_OS" \
          --target-arch "$AGENT_MEMORY_TARGET_ARCH" \
          --profile "$AGENT_MEMORY_PROFILE" \
          --tag "$AGENT_MEMORY_TAG"
        echo "artifact-directory=$AGENT_MEMORY_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
