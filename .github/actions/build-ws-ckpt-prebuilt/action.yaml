name: Build ws-ckpt prebuilt package
description: Build and package one ws-ckpt release target on the release Cross runner.

inputs:
  version:
    description: Component version without the v prefix.
    required: true
  target-os:
    description: Package target operating system.
    required: true
  target-arch:
    description: Package target architecture.
    required: true
  profile:
    description: Prepared Cross release profile.
    required: true
  tag:
    description: Release tag to bind to the checked-out commit. Empty for previews.
    required: false
    default: ''

outputs:
  artifact-directory:
    description: Directory containing the tar, checksums, and CycloneDX SBOM.
    value: ${{ steps.build.outputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Select Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Select Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.23.2'

    - name: Build precompiled package
      id: build
      shell: bash
      env:
        WS_CKPT_OUTPUT_DIR: ${{ runner.temp }}/ws-ckpt-prebuilt-${{ inputs.target-os }}-${{ inputs.target-arch }}
        WS_CKPT_VERSION: ${{ inputs.version }}
        WS_CKPT_TARGET_OS: ${{ inputs.target-os }}
        WS_CKPT_TARGET_ARCH: ${{ inputs.target-arch }}
        WS_CKPT_PROFILE: ${{ inputs.profile }}
        WS_CKPT_TAG: ${{ inputs.tag }}
      run: |
        "$GITHUB_ACTION_PATH/build.sh" \
          --source-repo "$GITHUB_WORKSPACE" \
          --output-dir "$WS_CKPT_OUTPUT_DIR" \
          --version "$WS_CKPT_VERSION" \
          --target-os "$WS_CKPT_TARGET_OS" \
          --target-arch "$WS_CKPT_TARGET_ARCH" \
          --profile "$WS_CKPT_PROFILE" \
          --tag "$WS_CKPT_TAG"
        echo "artifact-directory=$WS_CKPT_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
