name: Build agentsight prebuilt package
description: Build and package one agentsight release target on the release Cross runner.

inputs:
  version:
    description: Component version without the v prefix.
    required: true
  target-os:
    description: Package target operating system.
    required: true
  target-arch:
    description: Package target architecture.
    required: true
  profile:
    description: Prepared Cross release profile.
    required: true
  tag:
    description: Release tag to bind to the checked-out commit. Empty for previews.
    required: false
    default: ''

outputs:
  artifact-directory:
    description: Directory containing the tar, checksums, and CycloneDX SBOM.
    value: ${{ steps.build.outputs.artifact-directory }}

runs:
  using: composite
  steps:
    - name: Select Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build precompiled package
      id: build
      shell: bash
      env:
        AGENTSIGHT_OUTPUT_DIR: ${{ runner.temp }}/agentsight-prebuilt-${{ inputs.target-os }}-${{ inputs.target-arch }}
        AGENTSIGHT_VERSION: ${{ inputs.version }}
        AGENTSIGHT_TARGET_OS: ${{ inputs.target-os }}
        AGENTSIGHT_TARGET_ARCH: ${{ inputs.target-arch }}
        AGENTSIGHT_PROFILE: ${{ inputs.profile }}
        AGENTSIGHT_TAG: ${{ inputs.tag }}
      run: |
        "$GITHUB_ACTION_PATH/build.sh" \
          --source-repo "$GITHUB_WORKSPACE" \
          --output-dir "$AGENTSIGHT_OUTPUT_DIR" \
          --version "$AGENTSIGHT_VERSION" \
          --target-os "$AGENTSIGHT_TARGET_OS" \
          --target-arch "$AGENTSIGHT_TARGET_ARCH" \
          --profile "$AGENTSIGHT_PROFILE" \
          --tag "$AGENTSIGHT_TAG"
        echo "artifact-directory=$AGENTSIGHT_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
