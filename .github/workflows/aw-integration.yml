name: CI / AW Integration

on:
  schedule:
    # 03:23 Asia/Shanghai. Heavy integration never runs automatically on PRs.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit to validate before release
        required: true
        type: string
      credential_free:
        description: Validate an unmerged fork without hosted-model credentials
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_version:
        description: Validated release version for native archives
        type: string
        required: false
      candidate_sha:
        required: true
        type: string
      credential_free:
        type: boolean
        default: false
    secrets:
      QODER_PERSONAL_ACCESS_TOKEN:
        description: Qoder account token for native hosted-model security acceptance
        required: false

permissions:
  contents: read

concurrency:
  group: aw-integration-${{ github.event_name }}-${{ inputs.candidate_sha || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: AW / Integration plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      resident_matrix: ${{ steps.matrix.outputs.resident_matrix }}
    steps:
      - name: Select the exact candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            src/aw
            providers/agent-sec-core
            providers/tokenless
            docs/developer-guide/en/aw
      - name: Require a trusted candidate before executing repository code
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if test "${CREDENTIAL_FREE:-false}" = true; then
            test "$EVENT_NAME" = workflow_dispatch
            test "$REPOSITORY" != agentic-os-org/ANOLISA
            [[ "$WORKFLOW_REF" = refs/heads/* ]]
            test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          else
            if [[ "$WORKFLOW_REF" = refs/tags/aw/v* ]]; then
              test "$EVENT_NAME" = push
              test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
            else
              test "$WORKFLOW_REF" = refs/heads/main
            fi
            git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          fi
      - name: Validate native coverage and select pinned runtimes
        id: matrix
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
        run: |
          args=()
          if test "$CREDENTIAL_FREE" = true; then args+=(--credential-free); fi
          python3 -B src/aw/scripts/check_native.py --candidate-sha "$CANDIDATE_SHA" "${args[@]}"

  packages:
    needs: plan
    outputs:
      native_artifact: ${{ steps.upload-native.outputs.artifact-id }}
    name: AW / Package install tests
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    container:
      image: ubuntu:24.04
      # Package transactions require O_TMPFILE; the runner's overlay /tmp
      # does not support it. Fixtures also execute installed files here.
      options: --tmpfs /tmp:rw,exec,nosuid,mode=1777,size=2g
    timeout-minutes: 45
    steps:
      - name: Select isolated package output
        run: echo "AW_PACKAGE_DIR=$RUNNER_TEMP/aw-integration-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates \
            curl git pkg-config libssl-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
          workspaces: |
            src/aw
            providers/agent-sec-core
            providers/tokenless
            providers/ws-ckpt
            src/agent-sec-core/v2
            src/tokenless
            src/ws-ckpt/src
      - name: Test installer without Python
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if command -v python3 >/dev/null; then
            echo 'Installer acceptance requires a Python-free environment' >&2
            exit 1
          fi
          bash src/aw/scripts/check_packages.sh "$AW_PACKAGE_DIR/test-evidence"
      - name: Install packaging prerequisite
        run: apt-get install -y --no-install-recommends python3
      - name: Test installer and build independent artifacts
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          make -C distribution test-aw-packages
          # Standalone integration uses the candidate Makefile's default version.
          make -C distribution aw-packages ${RELEASE_VERSION:+"VERSION=$RELEASE_VERSION"} \
            OUTPUT="$AW_PACKAGE_DIR/packages" COMPONENTS="core sec-core tokenless ws-ckpt"
          make -C distribution aw-integration-backends BACKENDS="sec-core tokenless ws-ckpt"
      - name: Stage the same build for native acceptance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cargo build --locked --release --manifest-path src/aw/Cargo.toml -p aw-provider --example policy
          mkdir -p "$AW_PACKAGE_DIR/native"
          cp src/aw/target/release/aw providers/agent-sec-core/target/release/aw-provider-sec-core providers/tokenless/target/release/aw-provider-tokenless "$AW_PACKAGE_DIR/native/"
          cp src/aw/target/release/examples/policy src/tokenless/target/release/tokenless "$AW_PACKAGE_DIR/native/"
          cp src/agent-sec-core/v2/target/release/{agent-sec-cli,agent-sec-daemon} "$AW_PACKAGE_DIR/native/"
          cp src/aw/target/rtk-provenance.json "$AW_PACKAGE_DIR/test-evidence/"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/aw/Cargo.toml > "$AW_PACKAGE_DIR/native/aw-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path providers/agent-sec-core/Cargo.toml > "$AW_PACKAGE_DIR/native/sec-core-provider-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path providers/tokenless/Cargo.toml > "$AW_PACKAGE_DIR/native/tokenless-provider-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/agent-sec-core/v2/Cargo.toml > "$AW_PACKAGE_DIR/native/sec-core-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/tokenless/Cargo.toml > "$AW_PACKAGE_DIR/native/tokenless-packages.json"
          rustc --version > "$AW_PACKAGE_DIR/native/rustc-version.txt"
          cd "$AW_PACKAGE_DIR/native"
          sha256sum aw aw-provider-tokenless aw-provider-sec-core tokenless policy agent-sec-cli agent-sec-daemon > SHA256SUMS
          printf '%s\n' "$CANDIDATE_SHA" > source-sha.txt
          tar -czf "$AW_PACKAGE_DIR/native.tar.gz" .
      - uses: actions/upload-artifact@v4
        id: upload-native
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: ${{ env.AW_PACKAGE_DIR }}/native.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Stage the candidate ws-ckpt backend
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          mkdir -p "$AW_PACKAGE_DIR/ws-ckpt-backend"
          install -m 0755 src/ws-ckpt/src/target/release/ws-ckpt "$AW_PACKAGE_DIR/ws-ckpt-backend/ws-ckpt"
          cd "$AW_PACKAGE_DIR/ws-ckpt-backend"
          sha256sum ws-ckpt > SHA256SUMS
          printf '%s\n' "$CANDIDATE_SHA" > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aw-ws-ckpt-backend-${{ needs.plan.outputs.sha }}
          path: ${{ env.AW_PACKAGE_DIR }}/ws-ckpt-backend/
          retention-days: 3
          if-no-files-found: error
      - name: Verify sec-core authenticated health contract
        env:
          AW_SEC_HEALTH_TEST_HELPER: ${{ github.workspace }}/src/agent-sec-core/v2/target/release/agent-sec-daemon-health
        run: |
          cargo test --locked --manifest-path providers/agent-sec-core/Cargo.toml \
            -p aw-provider-sec-core --test health -- --ignored
      - name: Verify Tokenless PreTool and PostTool contracts
        env:
          TOKENLESS_COMPRESSION_ENABLED: '1'
          TOKENLESS_STATS_ENABLED: '0'
          TOKENLESS_SLS_ENABLED: '0'
        run: |
          export AW_TOKENLESS_TEST_CLI="$GITHUB_WORKSPACE/src/tokenless/target/release/tokenless"
          test -x "$AW_TOKENLESS_TEST_CLI"
          cargo test --locked --manifest-path providers/tokenless/Cargo.toml \
            -p aw-provider-tokenless --test provider --test pretool --test linked_rtk -- --ignored
          cargo test --locked --manifest-path providers/tokenless/Cargo.toml \
            -p aw-provider-tokenless --test views -- --ignored
      - name: Verify installed packages and service lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$AW_PACKAGE_DIR/packages"
          sha256sum -c SHA256SUMS
          for archive in *.tar.gz; do tar -xzf "$archive"; done
          evidence="$(dirname "$PWD")"
          runtime="$(mktemp -d /tmp/aw-integration.XXXXXX)"
          root="$runtime/prefixes"
          mkdir -m 700 "$root"
          export XDG_STATE_HOME="$runtime/package-state"
          trap 'mkdir -p "$evidence/demo"; cp -a "$runtime/demo/." "$evidence/demo/" 2>/dev/null || true; rm -rf "$runtime"' EXIT
          bundle_dir() {
            local matches=( "$PWD/$1-"*/ )
            test "${#matches[@]}" -eq 1 || return 1
            test -d "${matches[0]}" || return 1
            printf '%s\n' "${matches[0]%/}"
          }
          core_bundle="$(bundle_dir aw-core)"
          security_bundle="$(bundle_dir aw-provider-sec-core)"
          tokenless_bundle="$(bundle_dir aw-provider-tokenless)"
          checkpoint_bundle="$(bundle_dir aw-provider-ws-ckpt)"
          test -x "$core_bundle/bin/aw"
          test -f "$core_bundle/Makefile"
          test ! -e "$core_bundle/manifest.json"
          for bundle in "$security_bundle" "$tokenless_bundle" "$checkpoint_bundle"; do
            test -f "$bundle/package.json"
            test -d "$bundle/payload"
            test ! -e "$bundle/manifest.json"
            test ! -e "$bundle/aw"
          done
          make -C "$core_bundle" install PREFIX="$root/core-only"
          aw="$root/core-only/bin/aw"
          mkdir -m 700 "$runtime/core"
          "$aw" config init --prefix "$root/core-only" \
            --config "$runtime/core/aw.yaml" --state-dir "$runtime/core/state" --qoder /bin/true
          "$aw" config validate --config "$runtime/core/aw.yaml"
          checkpoint_prefix="$root/checkpoint"
          "$aw" install --bundle "$checkpoint_bundle" --prefix "$checkpoint_prefix"
          checkpoint_binary="$checkpoint_prefix/libexec/aw/providers/ws-ckpt/aw-provider-ws-ckpt"
          test -x "$checkpoint_binary"
          test -f "$checkpoint_prefix/share/aw/providers/ws-ckpt/examples/aw.yaml"
          "$aw" config init --prefix "$checkpoint_prefix" \
            --config "$runtime/checkpoint.yaml" --state-dir "$runtime/checkpoint-state" \
            --qoder /bin/true --template "$checkpoint_bundle/templates/ws-ckpt.json" \
            --template-var "PROVIDERS_DIR=$checkpoint_prefix/libexec/aw/providers" \
            --template-var "WS_CKPT_CLI=/bin/true"
          "$aw" config validate --config "$runtime/checkpoint.yaml"
          "$aw" uninstall --prefix "$checkpoint_prefix" --yes
          test ! -e "$checkpoint_binary"
          "$aw" install --bundle "$security_bundle" --prefix "$root/split"
          "$aw" install --bundle "$tokenless_bundle" --prefix "$root/split"
          "$aw" list --installed --prefix "$root/split" --json > "$runtime/split.json"
          export AW_TOKENLESS_TEST_CLI="$GITHUB_WORKSPACE/src/tokenless/target/release/tokenless"
          export AW_TEST_SEC_CLI="$GITHUB_WORKSPACE/src/agent-sec-core/v2/target/release/agent-sec-cli"
          export AW_TEST_SEC_DAEMON="$GITHUB_WORKSPACE/src/agent-sec-core/v2/target/release/agent-sec-daemon"
          export TOKENLESS_STATS_ENABLED=0 TOKENLESS_SLS_ENABLED=0
          umask 0002
          AW_TEST_PREFIX="$root/split" AW_TEST_AW="$aw" AW_TEST_WORK_DIR="$runtime/demo" \
            timeout 180 cargo test --locked --manifest-path "$GITHUB_WORKSPACE/src/aw/Cargo.toml" \
            -p aw-package --test installed -- --ignored
          # Independent Provider installations can coexist without copying backend programs.
          "$aw" install --bundle "$security_bundle" --prefix "$root/next"
          "$aw" install --bundle "$tokenless_bundle" --prefix "$root/next"
          "$aw" list --installed --prefix "$root/next" --json > "$runtime/next.json"
          python3 "$GITHUB_WORKSPACE/src/aw/scripts/compare_installed.py" "$runtime/split.json" "$runtime/next.json"
          "$aw" config init --prefix "$root/next" \
            --config "$runtime/next.yaml" --state-dir "$runtime/next-state" --qoder /bin/true
          "$aw" config validate --config "$runtime/next.yaml"
          printf 'caller-owned\n' > "$root/next/keep.txt"
          "$aw" uninstall --prefix "$root/next" --yes
          test -f "$root/next/keep.txt"
          test -x "$root/core-only/bin/aw"
          "$aw" uninstall --prefix "$root/split" --yes
          test -f "$runtime/demo/result.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aw-integration-linux-x86_64-${{ needs.plan.outputs.sha }}
          retention-days: 3
          path: |
            ${{ env.AW_PACKAGE_DIR }}/packages/*.tar.gz
            ${{ env.AW_PACKAGE_DIR }}/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-integration-evidence-${{ needs.plan.outputs.sha }}
          path: |
            ${{ env.AW_PACKAGE_DIR }}/test-evidence/*.log
            ${{ env.AW_PACKAGE_DIR }}/test-evidence/rtk-provenance.json
            ${{ env.AW_PACKAGE_DIR }}/demo/result.json
            ${{ env.AW_PACKAGE_DIR }}/demo/*.log
          if-no-files-found: ignore

  ws-ckpt-btrfs:
    needs: [plan, packages]
    name: AW / ws-ckpt Btrfs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            providers/ws-ckpt
            src/aw/crates/aw-cli/tests/fixtures/launcher
            src/ws-ckpt/src/skills/ws-ckpt
      - uses: actions/download-artifact@v4
        with:
          name: aw-integration-linux-x86_64-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/aw-checkpoint/packages
      - uses: actions/download-artifact@v4
        with:
          name: aw-ws-ckpt-backend-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/aw-checkpoint/backend
      - name: Prepare the VM for Btrfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends btrfs-progs rsync
          if ! grep -qw btrfs /proc/filesystems; then sudo modprobe btrfs; fi
          if ! test -c /dev/loop-control; then sudo modprobe loop; fi
          test -c /dev/loop-control
      - name: Verify snapshots using the packaged Provider and candidate backend
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aw-checkpoint"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat "$root/backend/source-sha.txt")" = "$CANDIDATE_SHA"
          (cd "$root/backend" && sha256sum -c SHA256SUMS)
          chmod 0755 "$root/backend/ws-ckpt"
          (cd "$root/packages" && sha256sum -c SHA256SUMS && for archive in *.tar.gz; do tar -xzf "$archive"; done)
          shopt -s nullglob
          core=("$root/packages/"aw-core-*/)
          checkpoint=("$root/packages/"aw-provider-ws-ckpt-*/)
          test "${#core[@]}" -eq 1
          test "${#checkpoint[@]}" -eq 1
          python3 -B - "$CANDIDATE_SHA" "${core[0]}share/doc/aw/source.json" "${checkpoint[0]}package.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          for path in map(Path, sys.argv[2:]):
              if json.loads(path.read_text())["source_commit"] != sys.argv[1]:
                  raise SystemExit(f"Candidate SHA mismatch in {path}")
          PY
          sudo bash providers/ws-ckpt/tests/btrfs-integration.sh \
            "${core[0]}bin/aw" "${checkpoint[0]}" "$root/backend/ws-ckpt" 2>&1 | tee "$root/ws-ckpt-btrfs.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-ws-ckpt-btrfs-evidence-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/aw-checkpoint/ws-ckpt-btrfs.log
          retention-days: 7
          if-no-files-found: warn

  native:
    needs: [plan, packages]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.packages.outputs.native_artifact != '' }}
    name: AW / Native (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            src/aw
            docs/developer-guide/en/aw
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          enable-cache: true
          cache-suffix: ${{ matrix.agent }}
          cache-dependency-glob: src/aw/tests/native-matrix.json
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: aw-native-npm-${{ runner.os }}-${{ matrix.agent }}-${{ hashFiles('src/aw/tests/native-matrix.json', 'src/aw/crates/aw-cli/tests/fixtures/pi/**/package-lock.json', 'src/aw/crates/aw-cli/tests/fixtures/pi/package-lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-binaries
      - name: Prepare native Python and candidate binaries
        env:
          NATIVE_PYTHON: ${{ matrix.python }}
        run: |
          # Standalone Python needs no loader overrides rejected by Hermes preflight.
          uv python install "$NATIVE_PYTHON"
          native_python="$(uv python find "$NATIVE_PYTHON")"
          echo "AW_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          dirname "$native_python" >> "$GITHUB_PATH"
          tar -xzf src/aw/target/native-binaries/native.tar.gz -C src/aw/target/native-binaries
      - name: Run pinned native acceptance
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          NATIVE_AGENT: ${{ matrix.agent }}
          # Only the Qoder matrix entry uses a cloud account. Missing credentials fail it.
          QODER_PERSONAL_ACCESS_TOKEN: ${{ !inputs.credential_free && (matrix.agent == 'qoder' || matrix.agent == 'qoder-sdk') && secrets.QODER_PERSONAL_ACCESS_TOKEN || '' }}
        run: |
          "$AW_NATIVE_PYTHON" -B src/aw/scripts/native_acceptance.py --agent "$NATIVE_AGENT" \
            --candidate-sha "$CANDIDATE_SHA" --bin src/aw/target/native-binaries \
            --output "src/aw/target/native-evidence/$NATIVE_AGENT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-native-evidence-${{ matrix.agent }}-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-evidence/${{ matrix.agent }}
          retention-days: 7
          if-no-files-found: error

  resident-image:
    needs: [plan, packages]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.packages.outputs.native_artifact != '' }}
    name: AW / Resident image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-binaries
      - name: Build one isolated image from the candidate payload
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tar -xzf src/aw/target/native-binaries/native.tar.gz -C src/aw/target/native-binaries
          python3 -B src/aw/scripts/resident_container.py --candidate-sha "$CANDIDATE_SHA" \
            --bin src/aw/target/native-binaries --build-only --output src/aw/target/resident-image
      - uses: actions/upload-artifact@v4
        with:
          name: aw-resident-image-${{ needs.plan.outputs.sha }}
          path: |
            src/aw/target/resident-image/image.tar
            src/aw/target/resident-image/image.json
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-resident-build-evidence-${{ needs.plan.outputs.sha }}
          path: |
            src/aw/target/resident-image/*.json
            src/aw/target/resident-image/*.jsonl
            src/aw/target/resident-image/*.log
          retention-days: 7
          if-no-files-found: error

  resident-container:
    needs: [plan, resident-image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.resident-image.result == 'success' }}
    name: AW / Resident (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.resident_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aw-resident-image-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-image
      - name: Run the declared resident shard
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          RESIDENT_SHARD: ${{ matrix.shard }}
        run: |
          python3 -B src/aw/scripts/resident_container.py --candidate-sha "$CANDIDATE_SHA" \
            --image-bundle src/aw/target/resident-image --shard "$RESIDENT_SHARD" \
            --output src/aw/target/resident-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-resident-evidence-${{ matrix.shard }}-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-evidence
          retention-days: 7
          if-no-files-found: error

  result:
    needs: [plan, packages, ws-ckpt-btrfs, native, resident-image, resident-container]
    if: always()
    name: AW / Integration result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a trusted integration plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            src/aw
            docs/developer-guide/en/aw
      - uses: actions/download-artifact@v4
        with:
          pattern: aw-native-evidence-*-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-results
      - uses: actions/download-artifact@v4
        with:
          pattern: aw-resident-evidence-*-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-results
      - uses: actions/download-artifact@v4
        if: always() && needs.plan.result == 'success'
        with:
          name: aw-resident-build-evidence-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-results/image
      - name: Require all native suites and report acceptance boundaries
        if: always() && needs.plan.result == 'success'
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          WS_CKPT_BTRFS_RESULT: ${{ needs.ws-ckpt-btrfs.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
          RESIDENT_IMAGE_RESULT: ${{ needs.resident-image.result }}
          RESIDENT_RESULT: ${{ needs.resident-container.result }}
        run: |
          args=()
          if test "$CREDENTIAL_FREE" = true; then args+=(--credential-free); fi
          python3 -B src/aw/scripts/native_summary.py --candidate-sha "$CANDIDATE_SHA" \
            --results src/aw/target/native-results --resident-results src/aw/target/resident-results "${args[@]}"
