name: Deploy / Pages

on:
  push:
    branches: [main, chore/gh-pages]
    paths:
      - '.github/docs-lint-exemptions.txt'
      - '.github/workflows/pages.yml'
      - 'AGENTS.md'
      - 'CHANGELOG*.md'
      - 'docs/**'
      - 'website/**'
      - 'src/**/CHANGELOG*.md'
      - 'src/**/Cargo.toml'
      - 'src/**/README.md'
      - 'src/**/package.json'
      - 'src/**/pyproject.toml'
      - 'src/anolisa/manifests/**'
      - 'src/anolisa/crates/anolisa-cli/src/commands.rs'
      - 'src/tokenless/crates/tokenless-cli/src/main.rs'
  pull_request:
    branches: [main]
    paths:
      - '.github/docs-lint-exemptions.txt'
      - '.github/workflows/pages.yml'
      - 'AGENTS.md'
      - 'CHANGELOG*.md'
      - 'docs/**'
      - 'website/**'
      - 'src/**/CHANGELOG*.md'
      - 'src/**/Cargo.toml'
      - 'src/**/README.md'
      - 'src/**/package.json'
      - 'src/**/pyproject.toml'
      - 'src/anolisa/manifests/**'
      - 'src/anolisa/crates/anolisa-cli/src/commands.rs'
      - 'src/tokenless/crates/tokenless-cli/src/main.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: >-
      ${{ github.repository == 'alibaba/anolisa' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-latest' }}
    env:
      SITE_URL: ${{ github.repository == 'agentic-os-org/ANOLISA' && 'https://agentic-os.sh' || format('https://{0}.github.io', github.repository_owner) }}
      BASE_URL: ${{ github.repository == 'agentic-os-org/ANOLISA' && '/' || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Verify the build URL matches GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const buildUrl = new URL(process.env.BASE_URL, process.env.SITE_URL);
          const pagesUrl = new URL(`${process.env.PAGES_URL.replace(/\/$/, '')}/`);
          assert.equal(buildUrl.href, pagesUrl.href,
            'SITE_URL and BASE_URL must match the configured GitHub Pages URL');
          NODE

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Validate bilingual sources
        run: npm run validate:locales --prefix website

      # Fork Pages deploy under a sub-path (BASE_URL=/<repo>/), which the
      # production root path cannot catch: an asset path that hard-codes
      # BASE_URL resolves only when BASE_URL is "/". Build once with a sub-path
      # first, then let the real build below overwrite the output.
      - name: Verify the website builds under a sub-path base URL
        env:
          SITE_URL: https://example.github.io
          BASE_URL: /base-url-check/
        run: npm run build --prefix website

      # Webpack's cached CSS can retain the sub-path font URLs.
      - name: Clear the sub-path build cache
        working-directory: website
        run: npm exec -- docusaurus clear

      - name: Build Docusaurus and check Markdown links
        run: npm run build --prefix website

      - name: Validate public installer
        run: |
          bash -n website/static/install.sh
          website/scripts/test-install.sh
          cmp website/static/install.sh website/build/install.sh

      - name: Smoke-test stable installer
        run: |
          install_dir="$(mktemp -d "${RUNNER_TEMP}/anolisa-install.XXXXXX")"
          ANOLISA_INSTALL_DIR="$install_dir" bash website/build/install.sh
          "$install_dir/anolisa" --version

      - name: Validate Agent index schema
        run: npm run validate:agent-index --prefix website

      - name: Validate generated links and DOM IDs
        run: npm run check:links --prefix website

      - name: Remove production custom domain from fork preview
        if: github.repository != 'agentic-os-org/ANOLISA'
        run: rm -f website/build/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy website
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      (github.repository != 'agentic-os-org/ANOLISA' &&
      github.ref == 'refs/heads/chore/gh-pages')))
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
