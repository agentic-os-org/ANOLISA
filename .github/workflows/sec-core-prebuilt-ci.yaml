name: CI / sec-core prebuilt action

on:
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/actions/build-sec-core-prebuilt/**'
      - '.github/actions/prebuilt-rust-common/**'
      - '.github/workflows/sec-core-prebuilt-ci.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-preview.yaml'
      - 'src/agent-sec-core/**'
  pull_request:
    paths:
      - '.github/actions/build-sec-core-prebuilt/**'
      - '.github/actions/prebuilt-rust-common/**'
      - '.github/workflows/sec-core-prebuilt-ci.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-preview.yaml'
      - 'src/agent-sec-core/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  RUSTUP_TOOLCHAIN: '1.93.0'

jobs:
  test:
    name: Test sec-core prebuilt action
    runs-on: anolisa-k8s-general-ci-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@1.93.0

      - name: Verify preinstalled cargo-sbom
        run: |
          if [[ "$(cargo sbom --version)" != 'cargo-sbom 0.10.0' ]]; then
            echo '::error::Runner image must provide cargo-sbom 0.10.0'
            exit 1
          fi

      - name: Run prebuilt action regression tests
        run: .github/actions/build-sec-core-prebuilt/test.sh

      - name: Run component packaging regression tests
        run: make -C src/agent-sec-core test-package-raw

      - name: Run prebuilt matrix planner tests
        run: python3 .github/actions/prebuilt-rust-common/test_plan_matrix.py
