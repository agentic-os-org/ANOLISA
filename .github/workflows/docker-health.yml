name: Container health contract
on:
  pull_request:
    paths:
      - 'distribution/docker/**'
      - 'tests/test_container_health.py'
      - '.github/workflows/docker-health.yml'
  push:
    branches: [main]
    paths:
      - 'distribution/docker/**'
      - 'tests/test_container_health.py'
      - '.github/workflows/docker-health.yml'
permissions:
  contents: read
jobs:
  health-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_container_health.py
