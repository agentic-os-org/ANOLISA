###############################################################################
# Docs Lint — documentation-standard.md enforcement
#
# Jobs:
#   docs-lint — bilingual naming convention + en/zh guide tree parity
#               + relative link integrity for guides and source entry points
###############################################################################

name: CI / Docs

on:
  pull_request:
    branches: [main, 'feature/**', 'release/**']
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/docs-lint.sh'
      - '.github/docs-lint-exemptions.txt'
      - 'scripts/docs-link-check.py'
      - 'tests/test_docs_link_references.py'
      - 'tests/test_docs_link_reference_review.py'
      - 'scripts/test_docs_link_check.py'
      - '.github/workflows/docs-lint.yml'

permissions:
  contents: read

jobs:
  docs-lint:
    name: 📚 Docs Lint
    runs-on: anolisa-k8s-general-ci-x64
    steps:
      - uses: actions/checkout@v4

      - name: Naming convention + en/zh tree parity
        run: bash scripts/docs-lint.sh

      - name: Reference link CLI regressions
        run: python3 -m unittest discover -s tests -p 'test_docs_link_references.py'

      - name: Reference review CLI regressions
        run: python3 -m unittest discover -s tests -p 'test_docs_link_reference_review.py'

      - name: Relative link check
        run: |
          python3 -m unittest discover -s scripts -p test_docs_link_check.py
          python3 scripts/docs-link-check.py
