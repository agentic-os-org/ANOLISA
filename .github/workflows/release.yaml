name: Release / Publish

on:
  push:
    tags:
      - 'cosh/v*'
      - 'cosh-ng/v*'
      - 'sec-core/v*'
      - 'sight/v*'
      - 'skill/v*'
      - 'tokenless/v*'
      - 'ckpt/v*'
      - 'memory/v*'
      - 'skillfs/v*'
      - 'ktuner/v*'
      - 'anolisa/v*'
      - 'aw/v*'

permissions:
  contents: write
  actions: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  # =========================================================================
  # Step 1: Parse tag and package
  # Triggered by push tag; produces official artifacts retained 28 days.
  # =========================================================================
  package:
    name: Package ${{ github.ref_name }}
    runs-on: anolisa-k8s-amd-release
    outputs:
      component: ${{ steps.parse.outputs.component }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      archive-sha256: ${{ steps.package-source.outputs.archive-sha256 }}
      prebuilt-enabled: ${{ steps.plan-prebuilt.outputs.enabled }}
      prebuilt-matrix: ${{ steps.plan-prebuilt.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SCOPE="${TAG%%/v*}"
          VERSION="${TAG#*/v}"

          case "$SCOPE" in
            cosh)     COMPONENT="copilot-shell" ;;
            cosh-ng)  COMPONENT="cosh-ng" ;;
            sec-core) COMPONENT="agent-sec-core" ;;
            sight)    COMPONENT="agentsight" ;;
            skill)    COMPONENT="os-skills" ;;
            tokenless) COMPONENT="tokenless" ;;
            ckpt)     COMPONENT="ws-ckpt" ;;
            memory)   COMPONENT="agent-memory" ;;
            skillfs)  COMPONENT="skillfs" ;;
            ktuner)   COMPONENT="ktuner" ;;
            aw)       COMPONENT="aw" ;;
            anolisa)  COMPONENT="anolisa" ;;
            *)
              echo "Unknown scope: $SCOPE"
              exit 1
              ;;
          esac

          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "tag=$TAG"             >> $GITHUB_OUTPUT

          echo "### Parsed Tag" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Component | \`$COMPONENT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`$VERSION\` |" >> $GITHUB_STEP_SUMMARY

      - name: Verify agent-sec-core V2 version matches tag
        if: steps.parse.outputs.component == 'agent-sec-core'
        env:
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          workspace_version=$(awk '
            $0 == "[workspace.package]" { in_section = 1; next }
            in_section && /^\[/ { exit }
            in_section && /^version = / {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' src/agent-sec-core/v2/Cargo.toml)
          test -n "$workspace_version"
          test "$workspace_version" = "$TAG_VERSION" || {
            echo "sec-core tag version $TAG_VERSION differs from V2 workspace version $workspace_version" >&2
            exit 1
          }

      - name: Plan precompiled packages
        if: steps.parse.outputs.component != 'aw'
        id: plan-prebuilt
        env:
          COMPONENT: ${{ steps.parse.outputs.component }}
        run: |
          python3 .github/actions/prebuilt-rust-common/plan_matrix.py \
            --component "$COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Package source archive
        if: steps.parse.outputs.component != 'aw'
        id: package-source
        uses: ./.github/actions/package-source
        with:
          component: ${{ steps.parse.outputs.component }}
          version: ${{ steps.parse.outputs.version }}
          artifact-suffix: ''
          retention-days: 28
          skill-sign-private-key: ${{ secrets.SKILL_SIGN_PRIVATE_KEY }}
          skill-sign-public-key: ${{ vars.SKILL_SIGN_PUBLIC_KEY }}

      - name: Package vendor archive
        if: steps.parse.outputs.component != 'aw'
        uses: ./.github/actions/package-vendor
        with:
          component: ${{ steps.parse.outputs.component }}
          version: ${{ steps.parse.outputs.version }}
          artifact-suffix: ''
          retention-days: 28

  aw_assets:
    needs: package
    if: needs.package.outputs.component == 'aw'
    uses: ./.github/workflows/aw-release.yml
    permissions:
      contents: read

  build_prebuilt:
    name: Build precompiled packages
    needs: package
    if: needs.package.outputs.prebuilt-enabled == 'true'
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64, anolisa-release-cross-x64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.prebuilt-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build OS Skills raw package
        id: os-skills-prebuilt
        if: matrix.component == 'os-skills'
        uses: ./.github/actions/build-os-skills-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build agent-memory precompiled package
        id: agent-memory-prebuilt
        if: matrix.component == 'agent-memory'
        uses: ./.github/actions/build-agent-memory-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build sec-core precompiled package
        id: sec-core-prebuilt
        if: matrix.component == 'agent-sec-core'
        uses: ./.github/actions/build-sec-core-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build agentsight precompiled package
        id: agentsight-prebuilt
        if: matrix.component == 'agentsight'
        uses: ./.github/actions/build-agentsight-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build cosh-ng precompiled package
        id: cosh-ng-prebuilt
        if: matrix.component == 'cosh-ng'
        uses: ./.github/actions/build-cosh-ng-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build Tokenless precompiled package
        id: tokenless-prebuilt
        if: matrix.component == 'tokenless'
        uses: ./.github/actions/build-tokenless-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build ws-ckpt precompiled package
        id: ws-ckpt-prebuilt
        if: matrix.component == 'ws-ckpt'
        uses: ./.github/actions/build-ws-ckpt-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build skillfs precompiled package
        id: skillfs-prebuilt
        if: matrix.component == 'skillfs'
        uses: ./.github/actions/build-skillfs-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Build ANOLISA CLI precompiled package
        id: anolisa-prebuilt
        if: matrix.component == 'anolisa'
        uses: ./.github/actions/build-anolisa-prebuilt
        with:
          version: ${{ needs.package.outputs.version }}
          target-os: ${{ matrix.target-os }}
          target-arch: ${{ matrix.target-arch }}
          profile: ${{ matrix.profile }}
          tag: ${{ needs.package.outputs.tag }}

      - name: Select precompiled package output
        id: prebuilt
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          ANOLISA_DIRECTORY: ${{ steps.anolisa-prebuilt.outputs.artifact-directory }}
          AGENT_MEMORY_DIRECTORY: ${{ steps.agent-memory-prebuilt.outputs.artifact-directory }}
          SEC_CORE_DIRECTORY: ${{ steps.sec-core-prebuilt.outputs.artifact-directory }}
          OS_SKILLS_DIRECTORY: ${{ steps.os-skills-prebuilt.outputs.artifact-directory }}
          AGENTSIGHT_DIRECTORY: ${{ steps.agentsight-prebuilt.outputs.artifact-directory }}
          COSH_NG_DIRECTORY: ${{ steps.cosh-ng-prebuilt.outputs.artifact-directory }}
          TOKENLESS_DIRECTORY: ${{ steps.tokenless-prebuilt.outputs.artifact-directory }}
          WS_CKPT_DIRECTORY: ${{ steps.ws-ckpt-prebuilt.outputs.artifact-directory }}
          SKILLFS_DIRECTORY: ${{ steps.skillfs-prebuilt.outputs.artifact-directory }}
        run: |
          case "$COMPONENT" in
            anolisa) ARTIFACT_DIRECTORY="$ANOLISA_DIRECTORY" ;;
            agent-memory) ARTIFACT_DIRECTORY="$AGENT_MEMORY_DIRECTORY" ;;
            agent-sec-core) ARTIFACT_DIRECTORY="$SEC_CORE_DIRECTORY" ;;
            os-skills) ARTIFACT_DIRECTORY="$OS_SKILLS_DIRECTORY" ;;
            agentsight) ARTIFACT_DIRECTORY="$AGENTSIGHT_DIRECTORY" ;;
            cosh-ng) ARTIFACT_DIRECTORY="$COSH_NG_DIRECTORY" ;;
            tokenless) ARTIFACT_DIRECTORY="$TOKENLESS_DIRECTORY" ;;
            ws-ckpt) ARTIFACT_DIRECTORY="$WS_CKPT_DIRECTORY" ;;
            skillfs) ARTIFACT_DIRECTORY="$SKILLFS_DIRECTORY" ;;
            *) echo "::error::Unsupported prebuilt component: $COMPONENT"; exit 1 ;;
          esac
          if [ -z "$ARTIFACT_DIRECTORY" ]; then
            echo "::error::Missing prebuilt output for $COMPONENT"
            exit 1
          fi
          echo "artifact-directory=$ARTIFACT_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Upload precompiled package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-prebuilt-${{ needs.package.outputs.version }}-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: ${{ steps.prebuilt.outputs.artifact-directory }}/*
          if-no-files-found: error
          retention-days: 28

      - name: Upload Tokenless Python wheels
        if: matrix.component == 'tokenless'
        uses: actions/upload-artifact@v4
        with:
          name: tokenless-python-wheels-${{ needs.package.outputs.version }}-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: ${{ steps.tokenless-prebuilt.outputs.wheel-directory }}/*
          if-no-files-found: error
          retention-days: 28

  # =========================================================================
  # Step 2: Publish (requires manual approval via GitHub Environment)
  #
  # If reviewer rejects, no Release is created.
  # =========================================================================
  publish:
    name: Publish ${{ needs.package.outputs.tag }}
    needs: [package, build_prebuilt, aw_assets]
    if: >-
      always() &&
      needs.package.result == 'success' &&
      (needs.package.outputs.component != 'aw' || needs.aw_assets.result == 'success') &&
      (needs.package.outputs.prebuilt-enabled != 'true' ||
       needs.build_prebuilt.result == 'success')
    permissions:
      contents: write
      actions: read
    environment: release
    runs-on: anolisa-k8s-amd-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified AW archives and SDKs
        if: needs.package.outputs.component == 'aw'
        uses: actions/download-artifact@v4
        with:
          name: aw-release-${{ github.sha }}
          path: ${{ runner.temp }}/aw-release

      - name: Verify AW release assets before publication
        if: needs.package.outputs.component == 'aw'
        working-directory: ${{ runner.temp }}/aw-release
        run: |
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          sha256sum --strict -c SHA256SUMS

      - name: Download official artifact
        if: needs.package.outputs.component != 'aw'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.component }}-${{ needs.package.outputs.version }}
          path: /tmp/archives

      - name: Verify official artifact checksum
        if: needs.package.outputs.component != 'aw'
        run: |
          COMPONENT="${{ needs.package.outputs.component }}"
          VERSION="${{ needs.package.outputs.version }}"
          ARCHIVE="/tmp/archives/${COMPONENT}-${VERSION}.tar.gz"
          EXPECTED="${{ needs.package.outputs.archive-sha256 }}"
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum mismatch for ${ARCHIVE}"
            echo "::error::Expected: $EXPECTED"
            echo "::error::Actual:   $ACTUAL"
            exit 1
          fi
          echo "Checksum verified: $ACTUAL"

      - name: Download vendor artifact (if exists)
        if: needs.package.outputs.component != 'aw'
        id: download-vendor
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.component }}-${{ needs.package.outputs.version }}-vendor
          path: /tmp/archives

      - name: Download precompiled packages
        if: needs.package.outputs.prebuilt-enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.package.outputs.component }}-prebuilt-${{ needs.package.outputs.version }}-*
          path: /tmp/prebuilt

      - name: Verify precompiled packages
        if: needs.package.outputs.prebuilt-enabled == 'true'
        env:
          COMPONENT: ${{ needs.package.outputs.component }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 .github/actions/prebuilt-rust-common/verify-artifacts.py \
            --directory /tmp/prebuilt \
            --component "$COMPONENT" \
            --version "$VERSION" \
            --layout actions

      - name: Download Tokenless Python wheels
        if: needs.package.outputs.component == 'tokenless'
        uses: actions/download-artifact@v4
        with:
          pattern: tokenless-python-wheels-${{ needs.package.outputs.version }}-*
          merge-multiple: true
          path: /tmp/python-wheels

      - name: Select Python 3.11
        if: needs.package.outputs.component == 'tokenless' || needs.package.outputs.component == 'agent-sec-core'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package the matching Skill Score recipe and raw index entries
        id: score-raw
        if: >-
          needs.package.outputs.component == 'agent-sec-core' &&
          !contains(needs.package.outputs.version, '-') &&
          !contains(needs.package.outputs.version, '+')
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          base="sec-core-$VERSION-linux-x86_64.tar.gz"
          cp "/tmp/prebuilt/agent-sec-core-prebuilt-$VERSION-linux-x86_64/$base" /tmp/archives/
          scripts=src/agent-sec-core/packaging/skill-score
          python3 "$scripts/package-optional.py" /tmp/archives --version "$VERSION" \
            --source-commit "$commit" --epoch "$(git show -s --format=%ct HEAD)"
          python3 "$scripts/prepare-release.py" /tmp/archives --version "$VERSION" \
            --source-commit "$commit" --stable-index

      - name: Verify Tokenless Python wheels
        if: needs.package.outputs.component == 'tokenless'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 .github/actions/build-tokenless-prebuilt/verify-wheels.py \
            --directory /tmp/python-wheels \
            --version "$VERSION" \
            --layout aggregate \
            --write-checksums /tmp/python-wheels/SHA256SUMS-python-wheels.txt

      - name: Package ANOLISA distribution manifests
        if: needs.package.outputs.component == 'anolisa'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          distribution/anolisa/scripts/package-manifests.sh "/tmp/archives/manifests-${VERSION}.tar.gz"
          cp "/tmp/archives/manifests-${VERSION}.tar.gz" /tmp/archives/manifests-latest.tar.gz
          (
            cd /tmp/archives
            sha256sum "manifests-${VERSION}.tar.gz" manifests-latest.tar.gz > SHA256SUMS-manifests.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PREBUILT_ENABLED: ${{ needs.package.outputs.prebuilt-enabled }}
          SCORE_RAW_RESULT: ${{ steps.score-raw.outcome }}
        run: |
          COMPONENT="${{ needs.package.outputs.component }}"
          VERSION="${{ needs.package.outputs.version }}"
          TAG="${{ needs.package.outputs.tag }}"
          ARCHIVE="/tmp/archives/${COMPONENT}-${VERSION}.tar.gz"

          case "$COMPONENT" in
            copilot-shell)  PREFIX="cosh/v" ;;
            cosh-ng)        PREFIX="cosh-ng/v" ;;
            agent-sec-core) PREFIX="sec-core/v" ;;
            agentsight)     PREFIX="sight/v" ;;
            os-skills)      PREFIX="skill/v" ;;
            tokenless)      PREFIX="tokenless/v" ;;
            ws-ckpt)        PREFIX="ckpt/v" ;;
            agent-memory)   PREFIX="memory/v" ;;
            skillfs)        PREFIX="skillfs/v" ;;
            ktuner)         PREFIX="ktuner/v" ;;
            aw)             PREFIX="aw/v" ;;
            anolisa)        PREFIX="anolisa/v" ;;
          esac

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          COMPARE_URL=$(python3 .github/scripts/generate_release_notes.py \
            --tag "$TAG" \
            --prefix "$PREFIX" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$NOTES_FILE")

          # Collect all assets to upload
          ASSETS=("$ARCHIVE")
          VENDOR_ARCHIVE="/tmp/archives/${COMPONENT}-${VERSION}-vendor.tar.gz"
          RELEASE_FLAGS=()
          if [ "$COMPONENT" = aw ]; then
            dir="$RUNNER_TEMP/aw-release"
            ASSETS=("$dir"/*.tar.gz "$dir"/*.tgz "$dir"/*.whl "$dir/sdk-candidate.json" "$dir/SHA256SUMS")
            RELEASE_FLAGS=(--verify-tag --latest=false)
          elif [ -f "$VENDOR_ARCHIVE" ]; then
            ASSETS+=("$VENDOR_ARCHIVE")
          fi
          if [ "$PREBUILT_ENABLED" = "true" ]; then
            while IFS= read -r asset; do
              ASSETS+=("$asset")
            done < <(
              find /tmp/prebuilt -mindepth 2 -maxdepth 2 -type f -print |
                LC_ALL=C sort
            )
          fi
          if [ "$COMPONENT" = anolisa ]; then
            ASSETS+=("/tmp/archives/manifests-${VERSION}.tar.gz")
            ASSETS+=(/tmp/archives/manifests-latest.tar.gz /tmp/archives/SHA256SUMS-manifests.txt)
          fi
          if [ "$SCORE_RAW_RESULT" = success ]; then
            ASSETS+=("/tmp/archives/sec-core-skill-score-$VERSION-linux-x86_64.tar.gz")
            ASSETS+=("/tmp/archives/sec-core-$VERSION-raw-index-v2.toml")
          fi
          if [ "$COMPONENT" = tokenless ]; then
            while IFS= read -r asset; do
              ASSETS+=("$asset")
            done < <(
              find /tmp/python-wheels -maxdepth 1 -type f \
                \( -name '*.whl' -o -name 'SHA256SUMS-python-wheels.txt' \) \
                -print | LC_ALL=C sort
            )
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists."
            echo "::error::If you need to re-publish, delete the existing release first, then re-run this workflow."
            exit 1
          fi

          gh release create "$TAG" "${RELEASE_FLAGS[@]}" \
            --title "${COMPONENT} v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --target "$(git rev-list -n 1 $TAG)" \
            "${ASSETS[@]}"

          RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')

          echo "### Release Created" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Component | \`${COMPONENT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [View Release](${RELEASE_URL}) |" >> $GITHUB_STEP_SUMMARY
          if [ -f "$VENDOR_ARCHIVE" ]; then
            echo "| Vendor | \`${COMPONENT}-${VERSION}-vendor.tar.gz\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Changelog | [Compare](${COMPARE_URL}) |" >> $GITHUB_STEP_SUMMARY
