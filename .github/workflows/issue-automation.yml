###############################################################################
# Issue Router
#
# A trusted external dispatcher invokes this workflow after the classifier or a
# structured report selects a component. GitHub
# Actions is the only writer: it validates the decision against repository
# metadata, applies the component label, optionally assigns owners for
# allowlisted reporters, comments as github-actions[bot], and notifies the
# component owners in the same run.
###############################################################################

name: Automation / Issue Router

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
        type: number
      component:
        description: Component ID from .github/components.json
        required: true
        type: string
      confidence:
        description: Classification confidence between 0 and 1
        required: true
        type: number
      summary:
        description: Public routing summary
        required: true
        type: string
      evidence:
        description: Short public evidence for the component decision
        required: false
        type: string
      decision_source:
        description: Router path (classifier or structured-form)
        required: true
        default: classifier
        type: string
      decision_id:
        description: Stable idempotency key generated by the dispatcher
        required: true
        type: string
      apply:
        description: Apply labels, assignment, comment, and notification
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Validate and apply triage
    runs-on: anolisa-k8s-general-ci-x64
    env:
      AUTOMATION_MODE: ${{ vars.COMMUNITY_AUTOMATION_MODE || 'apply' }}
      MIN_CONFIDENCE: ${{ vars.ISSUE_TRIAGE_MIN_CONFIDENCE || '0.80' }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      ISSUE_TRIAGE_POLICY: ${{ secrets.ISSUE_TRIAGE_POLICY }}

    steps:
      - name: Check out workflow implementation
        uses: actions/checkout@v4

      - name: Validate and apply routing decision
        id: triage
        uses: actions/github-script@v7
        env:
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_CONFIDENCE: ${{ inputs.confidence }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          INPUT_EVIDENCE: ${{ inputs.evidence }}
          INPUT_DECISION_SOURCE: ${{ inputs.decision_source }}
          INPUT_DECISION_ID: ${{ inputs.decision_id }}
          INPUT_APPLY: ${{ inputs.apply }}
        with:
          script: |
            const triage = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-triage.js`
            );
            await triage.run({ github, context, core, env: process.env });

      - name: Send DingTalk owner notification
        if: >-
          steps.triage.outputs.notification_required == 'true' &&
          steps.triage.outputs.owners != '' &&
          env.DINGTALK_WEBHOOK != ''
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.triage.outputs.issue_title }}
          ISSUE_URL: ${{ steps.triage.outputs.issue_url }}
          ISSUE_AUTHOR: ${{ steps.triage.outputs.issue_author }}
          OWNERS: ${{ steps.triage.outputs.owners }}
          ASSIGNED: ${{ steps.triage.outputs.assigned }}
          COMPONENT_LABEL: ${{ steps.triage.outputs.component_label }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
        run: |
          python3 << 'PYEOF'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.parse

          from dingtalk_notification import build_issue_markdown

          timestamp = str(round(time.time() * 1000))
          secret = os.environ.get("DINGTALK_SECRET", "")
          signature = hmac.new(
              secret.encode(),
              (timestamp + "\n" + secret).encode(),
              hashlib.sha256,
          ).digest()
          sign = urllib.parse.quote_plus(base64.b64encode(signature).decode())

          assigned = os.environ.get("ASSIGNED", "") or "none"
          text = build_issue_markdown(
              issue_number=os.environ["ISSUE_NUMBER"],
              issue_title=os.environ["ISSUE_TITLE"],
              issue_url=os.environ["ISSUE_URL"],
              component_label=os.environ["COMPONENT_LABEL"],
              author=os.environ["ISSUE_AUTHOR"],
              owners=os.environ["OWNERS"],
              assigned=assigned,
          )
          payload = json.dumps({
              "msgtype": "markdown",
              "markdown": {
                  "title": f"Issue Triage #{os.environ['ISSUE_NUMBER']}",
                  "text": text,
              },
          })
          url = (
              f"{os.environ['DINGTALK_WEBHOOK']}"
              f"&timestamp={timestamp}&sign={sign}"
          )
          response = subprocess.run(
              [
                  "curl",
                  "-fsS",
                  "-X",
                  "POST",
                  url,
                  "-H",
                  "Content-Type: application/json",
                  "-d",
                  payload,
              ],
              stdout=subprocess.PIPE,
              text=True,
              check=True,
          )
          validator = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              ".github/scripts/dingtalk_notification.py",
          )
          subprocess.run(
              [sys.executable, validator],
              input=response.stdout,
              text=True,
              check=True,
          )
          PYEOF

      - name: Record DingTalk notification
        if: >-
          success() &&
          steps.triage.outputs.notification_required == 'true' &&
          steps.triage.outputs.owners != '' &&
          env.DINGTALK_WEBHOOK != ''
        uses: actions/github-script@v7
        env:
          TRIAGE_COMMENT_ID: ${{ steps.triage.outputs.triage_comment_id }}
          DECISION_ID: ${{ inputs.decision_id }}
        with:
          script: |
            const triage = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-triage.js`
            );
            await triage.recordNotification({
              github,
              context,
              commentId: process.env.TRIAGE_COMMENT_ID,
              decisionId: process.env.DECISION_ID,
            });
