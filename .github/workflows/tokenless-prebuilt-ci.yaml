name: CI / Tokenless prebuilt action

on:
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/actions/build-tokenless-prebuilt/**'
      - '.github/actions/package-source/**'
      - '.github/actions/prebuilt-rust-common/**'
      - '.github/workflows/tokenless-prebuilt-ci.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-preview.yaml'
      - 'src/tokenless/**'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.github/actions/build-tokenless-prebuilt/**'
      - '.github/actions/package-source/**'
      - '.github/actions/prebuilt-rust-common/**'
      - '.github/workflows/tokenless-prebuilt-ci.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/release-preview.yaml'
      - 'src/tokenless/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  RUSTUP_TOOLCHAIN: '1.93.0'

jobs:
  test:
    name: Test Tokenless prebuilt action
    runs-on: anolisa-k8s-general-ci-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - uses: dtolnay/rust-toolchain@1.93.0

      - name: Verify preinstalled cargo-sbom
        run: |
          if [[ "$(cargo sbom --version)" != 'cargo-sbom 0.10.0' ]]; then
            echo '::error::Runner image must provide cargo-sbom 0.10.0'
            exit 1
          fi

      - name: Run prebuilt action regression tests
        run: .github/actions/build-tokenless-prebuilt/test.sh

      - name: Run prebuilt matrix planner tests
        run: python3 .github/actions/prebuilt-rust-common/test_plan_matrix.py

      - name: Run Tokenless raw package tests
        run: src/tokenless/tests/test-package-raw.sh

  windows:
    name: Windows x64 build and Wine smoke
    # The persistent release runner only executes trusted pushes or explicit dispatches.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, anolisa-release-cross-x64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Tokenless version
        id: version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src/tokenless/Cargo.toml)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Cross-compile, package and smoke Windows artifacts
        id: build
        uses: ./.github/actions/build-tokenless-prebuilt
        with:
          version: ${{ steps.version.outputs.value }}
          target-os: windows
          target-arch: x86_64
          profile: windows-msvc-x86_64

      - name: Upload Windows ZIP, SBOM and wheel
        uses: actions/upload-artifact@v4
        with:
          name: tokenless-windows-x86_64
          path: |
            ${{ steps.build.outputs.artifact-directory }}/*
            ${{ steps.build.outputs.wheel-directory }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows builder diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokenless-windows-diagnostics
          path: |
            ${{ runner.temp }}/tokenless-prebuilt-windows-x86_64.build/out/*.log
            ${{ runner.temp }}/tokenless-prebuilt-windows-x86_64.build/out/*.txt
          if-no-files-found: ignore
          retention-days: 7
