name: CI / AW Integration

on:
  schedule:
    # 03:23 Asia/Shanghai. Heavy integration never runs automatically on PRs.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit to validate before release
        required: true
        type: string
      credential_free:
        description: Validate an unmerged fork without hosted-model credentials
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      credential_free:
        type: boolean
        default: false
    secrets:
      QODER_PERSONAL_ACCESS_TOKEN:
        description: Qoder account token for native hosted-model security acceptance
        required: false

permissions:
  contents: read

concurrency:
  group: aw-integration-${{ github.event_name }}-${{ inputs.candidate_sha || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: AW / Integration plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      resident_matrix: ${{ steps.matrix.outputs.resident_matrix }}
    steps:
      - name: Select the exact candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'schedule' && github.sha || inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            src/aw
            providers/agent-sec-core
            providers/tokenless
            docs/developer-guide/en/aw
      - name: Require a trusted candidate before executing repository code
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if test "${CREDENTIAL_FREE:-false}" = true; then
            test "$EVENT_NAME" = workflow_dispatch
            test "$REPOSITORY" != agentic-os-org/ANOLISA
            [[ "$WORKFLOW_REF" = refs/heads/* ]]
            test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          else
            test "$WORKFLOW_REF" = refs/heads/main
            git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          fi
      - name: Validate native coverage and select pinned runtimes
        id: matrix
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
        run: |
          args=()
          if test "$CREDENTIAL_FREE" = true; then args+=(--credential-free); fi
          python3 -B src/aw/scripts/check_native.py --candidate-sha "$CANDIDATE_SHA" "${args[@]}"

  packages:
    needs: plan
    name: AW / Package install tests
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      - name: Select isolated package output
        run: echo "AW_PREVIEW_DIR=$RUNNER_TEMP/aw-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates \
            curl git pkg-config libssl-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'schedule' }}
          workspaces: |
            src/aw
            providers/agent-sec-core
            providers/tokenless
            src/agent-sec-core/v2
            src/tokenless
      - name: Test installer and build the four artifacts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if command -v python3 >/dev/null; then
            echo 'Installer acceptance requires a Python-free environment' >&2
            exit 1
          fi
          bash src/aw/scripts/check_packages.sh "$AW_PREVIEW_DIR/test-evidence"
          cargo run --locked --release --manifest-path src/aw/Cargo.toml \
            -p aw-package --bin aw-build -- --version 0.1.0-preview.1 \
            --output "$AW_PREVIEW_DIR/packages" --component all
      - name: Stage the same build for native acceptance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cargo build --locked --release --manifest-path src/aw/Cargo.toml -p aw-provider --example policy
          mkdir -p "$AW_PREVIEW_DIR/native"
          cp src/aw/target/release/{aw,rtk} providers/agent-sec-core/target/release/aw-provider-sec-core providers/tokenless/target/release/aw-provider-tokenless "$AW_PREVIEW_DIR/native/"
          cp src/aw/target/release/examples/policy src/tokenless/target/release/tokenless "$AW_PREVIEW_DIR/native/"
          cp src/agent-sec-core/v2/target/release/{agent-sec-cli,agent-sec-daemon} "$AW_PREVIEW_DIR/native/"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/aw/Cargo.toml > "$AW_PREVIEW_DIR/native/aw-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path providers/agent-sec-core/Cargo.toml > "$AW_PREVIEW_DIR/native/sec-core-provider-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path providers/tokenless/Cargo.toml > "$AW_PREVIEW_DIR/native/tokenless-provider-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/agent-sec-core/v2/Cargo.toml > "$AW_PREVIEW_DIR/native/sec-core-packages.json"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/tokenless/Cargo.toml > "$AW_PREVIEW_DIR/native/tokenless-packages.json"
          rustc --version > "$AW_PREVIEW_DIR/native/rustc-version.txt"
          cd "$AW_PREVIEW_DIR/native"
          sha256sum aw aw-provider-tokenless aw-provider-sec-core tokenless rtk policy agent-sec-cli agent-sec-daemon > SHA256SUMS
          printf '%s\n' "$CANDIDATE_SHA" > source-sha.txt
          tar -czf "$AW_PREVIEW_DIR/native.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: ${{ env.AW_PREVIEW_DIR }}/native.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Verify sec-core authenticated health contract
        env:
          AW_SEC_HEALTH_TEST_HELPER: ${{ github.workspace }}/src/agent-sec-core/v2/target/release/agent-sec-daemon-health
        run: |
          cargo test --locked --manifest-path providers/agent-sec-core/Cargo.toml \
            -p aw-provider-sec-core --test health -- --ignored
      - name: Verify Tokenless PreTool and PostTool contracts
        env:
          TOKENLESS_COMPRESSION_ENABLED: '1'
          TOKENLESS_STATS_ENABLED: '0'
          TOKENLESS_SLS_ENABLED: '0'
        run: |
          export AW_TOKENLESS_TEST_CLI="$GITHUB_WORKSPACE/src/tokenless/target/release/tokenless"
          export AW_TOKENLESS_TEST_RTK="$GITHUB_WORKSPACE/src/aw/target/release/rtk"
          test -x "$AW_TOKENLESS_TEST_CLI"
          test -x "$AW_TOKENLESS_TEST_RTK"
          cargo test --locked --manifest-path providers/tokenless/Cargo.toml \
            -p aw-provider-tokenless --test provider --test pretool --test managed_rtk -- --ignored
          cargo test --locked --manifest-path providers/tokenless/Cargo.toml \
            -p aw-provider-tokenless --test views -- --ignored
      - name: Install package comparison prerequisite
        run: apt-get install -y --no-install-recommends python3
      - name: Verify installed packages and service lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$AW_PREVIEW_DIR/packages"
          sha256sum -c SHA256SUMS
          for archive in *.tar.gz; do tar -xzf "$archive"; done
          evidence="$(dirname "$PWD")"
          runtime="$(mktemp -d /tmp/aw-preview.XXXXXX)"
          root="$runtime/prefixes"
          mkdir -m 700 "$root"
          export XDG_STATE_HOME="$runtime/package-state"
          trap 'mkdir -p "$evidence/demo"; cp -a "$runtime/demo/." "$evidence/demo/" 2>/dev/null || true; rm -rf "$runtime"' EXIT
          bundle_dir() {
            local matches=( "$PWD/$1-"*/ )
            test "${#matches[@]}" -eq 1 || return 1
            test -d "${matches[0]}" || return 1
            printf '%s\n' "${matches[0]%/}"
          }
          core_bundle="$(bundle_dir aw-core)"
          security_bundle="$(bundle_dir aw-provider-sec-core)"
          tokenless_bundle="$(bundle_dir aw-provider-tokenless)"
          combined_bundle="$(bundle_dir aw-all-in-one)"
          for bundle in "$core_bundle" "$security_bundle" "$tokenless_bundle" "$combined_bundle"; do
            test -x "$bundle/aw"
            test ! -e "$bundle/aw-package"
          done
          "$core_bundle/aw" install --bundle "$core_bundle" --prefix "$root/core-only"
          mkdir -m 700 "$runtime/core"
          "$root/core-only/bin/aw" config init --prefix "$root/core-only" \
            --config "$runtime/core/aw.yaml" --state-dir "$runtime/core/state" \
            --qoder /bin/true
          "$root/core-only/bin/aw" config validate --config "$runtime/core/aw.yaml"
          test ! -e "$root/core-only/libexec"
          test ! -e "$root/core-only/bin/aw-package"
          "$root/core-only/bin/aw" uninstall --prefix "$root/core-only" --yes
          "$core_bundle/aw" install --bundle "$core_bundle" --prefix "$root/split"
          "$security_bundle/aw" install --bundle "$security_bundle" --prefix "$root/split"
          "$tokenless_bundle/aw" install --bundle "$tokenless_bundle" --prefix "$root/split"
          "$combined_bundle/aw" install --bundle "$combined_bundle" --prefix "$root/combined"
          "$combined_bundle/aw" list --installed --prefix "$root/split" --json > "$runtime/split.json"
          "$combined_bundle/aw" list --installed --prefix "$root/combined" --json > "$runtime/combined.json"
          python3 "$GITHUB_WORKSPACE/src/aw/scripts/compare_installed.py" "$runtime/split.json" "$runtime/combined.json"
          AW_TOKENLESS_TEST_CLI="$root/combined/libexec/aw/providers/tokenless/tokenless" \
          AW_TOKENLESS_TEST_RTK="$root/combined/libexec/aw/providers/tokenless/rtk" \
          TOKENLESS_STATS_ENABLED=0 TOKENLESS_SLS_ENABLED=0 \
            timeout 120 cargo test --locked --manifest-path "$GITHUB_WORKSPACE/providers/tokenless/Cargo.toml" \
            -p aw-provider-tokenless --test managed_rtk -- --ignored
          umask 0002
          AW_TEST_PREFIX="$root/combined" AW_TEST_WORK_DIR="$runtime/demo" \
            timeout 180 cargo test --locked --manifest-path "$GITHUB_WORKSPACE/src/aw/Cargo.toml" \
            -p aw-package --test installed -- --ignored
          # Preview upgrades use a new prefix; retain the old one for rollback.
          "$combined_bundle/aw" install --bundle "$combined_bundle" --prefix "$root/next"
          "$combined_bundle/aw" list --installed --prefix "$root/next" --json > "$runtime/next.json"
          python3 "$GITHUB_WORKSPACE/src/aw/scripts/compare_installed.py" "$runtime/combined.json" "$runtime/next.json"
          "$root/next/bin/aw" config init --prefix "$root/next" \
            --config "$runtime/next.yaml" --state-dir "$runtime/next-state" --qoder /bin/true
          "$root/next/bin/aw" config validate --config "$runtime/next.yaml"
          "$combined_bundle/aw" uninstall --prefix "$root/next" --yes
          test -x "$root/combined/bin/aw"
          cp "$combined_bundle/manifest.json" "$evidence/demo-manifest.json"
          "$combined_bundle/aw" uninstall --prefix "$root/combined" --yes
          "$core_bundle/aw" uninstall --prefix "$root/split" --yes
          test -f "$runtime/demo/result.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aw-preview-linux-x86_64-${{ needs.plan.outputs.sha }}
          retention-days: 3
          path: |
            ${{ env.AW_PREVIEW_DIR }}/packages/*.tar.gz
            ${{ env.AW_PREVIEW_DIR }}/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-preview-evidence-${{ needs.plan.outputs.sha }}
          path: |
            ${{ env.AW_PREVIEW_DIR }}/test-evidence/*.log
            ${{ env.AW_PREVIEW_DIR }}/demo-manifest.json
            ${{ env.AW_PREVIEW_DIR }}/demo/result.json
            ${{ env.AW_PREVIEW_DIR }}/demo/*.log
          if-no-files-found: ignore

  native:
    needs: [plan, packages]
    name: AW / Native (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            src/aw
            docs/developer-guide/en/aw
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.13'
          enable-cache: true
          cache-suffix: ${{ matrix.agent }}
          cache-dependency-glob: src/aw/tests/native-matrix.json
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: aw-native-npm-${{ runner.os }}-${{ matrix.agent }}-${{ hashFiles('src/aw/tests/native-matrix.json', 'src/aw/crates/aw-cli/tests/fixtures/pi/package-lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-binaries
      - name: Prepare native Python and candidate binaries
        env:
          NATIVE_PYTHON: ${{ matrix.python }}
        run: |
          # Standalone Python needs no loader overrides rejected by Hermes preflight.
          uv python install "$NATIVE_PYTHON"
          native_python="$(uv python find "$NATIVE_PYTHON")"
          echo "AW_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
          dirname "$native_python" >> "$GITHUB_PATH"
          tar -xzf src/aw/target/native-binaries/native.tar.gz -C src/aw/target/native-binaries
      - name: Run pinned native acceptance
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          NATIVE_AGENT: ${{ matrix.agent }}
          # Only the Qoder matrix entry uses a cloud account. Missing credentials fail it.
          QODER_PERSONAL_ACCESS_TOKEN: ${{ !inputs.credential_free && (matrix.agent == 'qoder' || matrix.agent == 'qoder-sdk') && secrets.QODER_PERSONAL_ACCESS_TOKEN || '' }}
        run: |
          "$AW_NATIVE_PYTHON" -B src/aw/scripts/native_acceptance.py --agent "$NATIVE_AGENT" \
            --candidate-sha "$CANDIDATE_SHA" --bin src/aw/target/native-binaries \
            --output "src/aw/target/native-evidence/$NATIVE_AGENT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-native-evidence-${{ matrix.agent }}-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-evidence/${{ matrix.agent }}
          retention-days: 7
          if-no-files-found: error

  resident-image:
    needs: [plan, packages]
    name: AW / Resident image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: aw-native-binaries-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-binaries
      - name: Build one isolated image from the candidate payload
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tar -xzf src/aw/target/native-binaries/native.tar.gz -C src/aw/target/native-binaries
          python3 -B src/aw/scripts/resident_container.py --candidate-sha "$CANDIDATE_SHA" \
            --bin src/aw/target/native-binaries --build-only --output src/aw/target/resident-image
      - uses: actions/upload-artifact@v4
        with:
          name: aw-resident-image-${{ needs.plan.outputs.sha }}
          path: |
            src/aw/target/resident-image/image.tar
            src/aw/target/resident-image/image.json
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-resident-build-evidence-${{ needs.plan.outputs.sha }}
          path: |
            src/aw/target/resident-image/*.json
            src/aw/target/resident-image/*.jsonl
            src/aw/target/resident-image/*.log
          retention-days: 7
          if-no-files-found: error

  resident-container:
    needs: [plan, resident-image]
    name: AW / Resident (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.resident_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aw-resident-image-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-image
      - name: Run the declared resident shard
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          RESIDENT_SHARD: ${{ matrix.shard }}
        run: |
          python3 -B src/aw/scripts/resident_container.py --candidate-sha "$CANDIDATE_SHA" \
            --image-bundle src/aw/target/resident-image --shard "$RESIDENT_SHARD" \
            --output src/aw/target/resident-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-resident-evidence-${{ matrix.shard }}-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-evidence
          retention-days: 7
          if-no-files-found: error

  result:
    needs: [plan, packages, native, resident-image, resident-container]
    if: always()
    name: AW / Integration result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a trusted integration plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            src/aw
            docs/developer-guide/en/aw
      - uses: actions/download-artifact@v4
        with:
          pattern: aw-native-evidence-*-${{ needs.plan.outputs.sha }}
          path: src/aw/target/native-results
      - uses: actions/download-artifact@v4
        with:
          pattern: aw-resident-evidence-*-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-results
      - uses: actions/download-artifact@v4
        if: always() && needs.plan.result == 'success'
        with:
          name: aw-resident-build-evidence-${{ needs.plan.outputs.sha }}
          path: src/aw/target/resident-results/image
      - name: Require all native suites and report acceptance boundaries
        if: always() && needs.plan.result == 'success'
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CREDENTIAL_FREE: ${{ inputs.credential_free || false }}
          RESIDENT_IMAGE_RESULT: ${{ needs.resident-image.result }}
          RESIDENT_RESULT: ${{ needs.resident-container.result }}
        run: |
          args=()
          if test "$CREDENTIAL_FREE" = true; then args+=(--credential-free); fi
          python3 -B src/aw/scripts/native_summary.py --candidate-sha "$CANDIDATE_SHA" \
            --results src/aw/target/native-results --resident-results src/aw/target/resident-results "${args[@]}"
