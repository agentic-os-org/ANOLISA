name: CI / AW Packages

on:
  pull_request:
    paths:
      - 'src/aw/crates/aw-package/**'
      - 'src/aw/crates/aw-provider-tokenless/**'
      - 'src/aw/crates/aw-provider-sec-core/**'
      - 'src/agent-sec-core/v2/**'
      - 'src/agent-sec-core/packaging/systemd/**'
      - 'src/tokenless/crates/**'
      - 'src/tokenless/Cargo.*'
      - 'src/tokenless/scripts/setup-rtk.sh'
      - 'src/tokenless/third_party/patches/**'
      - 'src/aw/Cargo.*'
      - 'docs/user-guide/*/user-entrypoint/aw-preview.md'
      - '.github/workflows/aw-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aw-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: AW / Package install tests
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      - name: Select isolated package output
        run: echo "AW_PREVIEW_DIR=$RUNNER_TEMP/aw-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates \
            curl git pkg-config libssl-dev
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/aw
            src/agent-sec-core/v2
            src/tokenless
      - name: Test installer and build the four artifacts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ! command -v python3
          cargo test --locked --manifest-path src/aw/Cargo.toml -p aw-package
          cargo run --locked --release --manifest-path src/aw/Cargo.toml \
            -p aw-package --bin aw-build -- --version 0.1.0-preview.1 \
            --output "$AW_PREVIEW_DIR/packages" --component all
      - name: Verify sec-core authenticated health contract
        env:
          AW_SEC_HEALTH_TEST_HELPER: ${{ github.workspace }}/src/agent-sec-core/v2/target/release/agent-sec-daemon-health
        run: |
          cargo test --locked --manifest-path src/aw/Cargo.toml \
            -p aw-provider-sec-core --test health -- --ignored
      - name: Verify Tokenless PreTool and PostTool contracts
        env:
          TOKENLESS_COMPRESSION_ENABLED: '1'
          TOKENLESS_STATS_ENABLED: '0'
          TOKENLESS_SLS_ENABLED: '0'
        run: |
          export AW_TOKENLESS_TEST_CLI="$GITHUB_WORKSPACE/src/tokenless/target/release/tokenless"
          export AW_TOKENLESS_TEST_RTK="$GITHUB_WORKSPACE/src/aw/target/release/rtk"
          test -x "$AW_TOKENLESS_TEST_CLI"
          test -x "$AW_TOKENLESS_TEST_RTK"
          cargo test --locked --manifest-path src/aw/Cargo.toml \
            -p aw-provider-tokenless --test provider --test pretool --test managed_rtk -- --ignored
          cargo test --locked --manifest-path src/aw/Cargo.toml \
            -p aw-provider-tokenless --test views -- --ignored
      - name: Verify installed packages and service lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd "$AW_PREVIEW_DIR/packages"
          sha256sum -c SHA256SUMS
          for archive in *.tar.gz; do tar -xzf "$archive"; done
          root="$(dirname "$PWD")"
          chmod 700 "$root"
          runtime="$(mktemp -d /tmp/aw-preview.XXXXXX)"
          trap 'mkdir -p "$root/demo"; cp -a "$runtime/demo/." "$root/demo/" 2>/dev/null || true; rm -rf "$runtime"' EXIT
          aw-core-*/aw-package install --prefix "$root/core-only"
          mkdir -m 700 "$runtime/core"
          "$root/core-only/bin/aw-package" configure --prefix "$root/core-only" \
            --config "$runtime/core/aw.yaml" --state-dir "$runtime/core/state" \
            --qoder /bin/true
          "$root/core-only/bin/aw" validate --config "$runtime/core/aw.yaml"
          test ! -e "$root/core-only/libexec"
          "$root/core-only/bin/aw-package" uninstall --prefix "$root/core-only"
          aw-core-*/aw-package install --prefix "$root/split"
          aw-provider-sec-core-*/aw-package install --prefix "$root/split"
          aw-provider-tokenless-*/aw-package install --prefix "$root/split"
          aw-all-in-one-*/aw-package install --prefix "$root/combined"
          diff -r "$root/split/.aw-packages" "$root/combined/.aw-packages"
          AW_TOKENLESS_TEST_CLI="$root/combined/libexec/aw/providers/tokenless/tokenless" \
          AW_TOKENLESS_TEST_RTK="$root/combined/libexec/aw/providers/tokenless/rtk" \
          TOKENLESS_STATS_ENABLED=0 TOKENLESS_SLS_ENABLED=0 \
            timeout 120 cargo test --locked --manifest-path "$GITHUB_WORKSPACE/src/aw/Cargo.toml" \
            -p aw-provider-tokenless --test managed_rtk -- --ignored
          umask 0002
          AW_TEST_PREFIX="$root/combined" AW_TEST_WORK_DIR="$runtime/demo" \
            timeout 180 cargo test --locked --manifest-path "$GITHUB_WORKSPACE/src/aw/Cargo.toml" \
            -p aw-package --test installed -- --ignored
          aw-all-in-one-*/aw-package uninstall --prefix "$root/combined"
          test -f "$runtime/demo/result.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aw-preview-linux-x86_64-${{ github.sha }}${{ github.event_name == 'pull_request' && '-validation' || '' }}
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
          path: |
            ${{ env.AW_PREVIEW_DIR }}/packages/*.tar.gz
            ${{ env.AW_PREVIEW_DIR }}/packages/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-preview-evidence-${{ github.sha }}
          path: |
            ${{ env.AW_PREVIEW_DIR }}/demo/result.json
            ${{ env.AW_PREVIEW_DIR }}/demo/*.log
          if-no-files-found: ignore
