name: Release / AW

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aw-release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged candidate to belong to main
        if: github.event_name == 'push'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Match the source package versions to the release tag
        id: version
        run: |
          version=$(python3 -B distribution/packaging/aw/release_version.py)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "aw/v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  integration:
    needs: candidate
    uses: ./.github/workflows/aw-integration.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      release_version: ${{ needs.candidate.outputs.version }}
      packages_only: true
      credential_free: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.fork }}

  assets:
    needs: [candidate, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE: ${{ needs.candidate.outputs.sha }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: python3 -m pip install setuptools==68.1.2 wheel==0.42.0
      - uses: actions/download-artifact@v4
        with:
          # An empty ID would select every artifact in the run.
          artifact-ids: ${{ needs.integration.outputs.archive_id || 'missing-archive-id' }}
          merge-multiple: true
          path: native-archives
      - name: Assemble the accepted native archives and matching SDKs
        run: |
          sdk=distribution/packaging/aw/sdk_candidate.py
          python3 -B "$sdk" build --repo . --candidate "$CANDIDATE" --output assets
          python3 -B "$sdk" verify --repo . --candidate "$CANDIDATE" --receipt assets/sdk-candidate.json
          mv native-archives/*.tar.gz native-archives/SHA256SUMS assets/
          cd assets
          sha256sum *.tgz *.whl sdk-candidate.json >> SHA256SUMS
      - name: Verify the exact release receipts and checksums
        run: python3 -B distribution/packaging/aw/verify_release_assets.py assets "$CANDIDATE" "$VERSION"
      - name: Test the packaged SDKs against the release binary
        run: |
          bundle="aw-core-$VERSION-linux-x86_64"
          runtime=$(mktemp -d)
          trap 'rm -rf "$runtime"' EXIT
          tar -xOf "assets/$bundle.tar.gz" "$bundle/bin/aw" > "$runtime/aw"
          chmod 700 "$runtime/aw"
          # Native fixtures resolve a trusted OS Python; pip uses setup-python's pythonLocation.
          mkdir "$runtime/tools"
          ln -s /usr/bin/python3 "$runtime/tools/python3"
          PATH="$runtime/tools:$PATH" python3 -B src/aw/sdk/tests/release_contract.py "$runtime/aw" assets/sdk-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          # Candidate attempts have separate receipts. Publish consumes the tag run's own artifact.
          name: ${{ github.event_name == 'workflow_dispatch' && format('aw-release-{0}-{1}', env.CANDIDATE, github.run_attempt) || format('aw-release-{0}', env.CANDIDATE) }}
          overwrite: ${{ github.event_name == 'push' }}
          path: assets/
          if-no-files-found: error
          retention-days: 28
