name: CI / AW

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/aw/**'
      - '.github/workflows/aw-ci.yml'
  pull_request:
    paths:
      - 'src/aw/**'
      - '.github/workflows/aw-ci.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  required:
    name: AW / required
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /src/aw/scripts/check.py
            /src/aw/tests/test_ci_checks.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the gate and select AW changes
        id: scope
        run: python3 src/aw/scripts/check.py scope

      - name: Restore the full working tree for Cargo package discovery
        if: steps.scope.outputs.selected == 'true'
        run: git sparse-checkout disable
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.selected == 'true'
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.selected == 'true'
        with:
          node-version: '24.15.0'
      - name: Prepare the pinned Rust toolchain
        if: steps.scope.outputs.selected == 'true'
        working-directory: src/aw
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.selected == 'true'
        with:
          workspaces: src/aw
      - name: Run AW checks
        if: steps.scope.outputs.selected == 'true'
        id: checks
        run: python3 src/aw/scripts/check.py

      - name: Require the expected result
        if: always()
        env:
          SCOPE_RESULT: ${{ steps.scope.outcome }}
          CHECKS_RESULT: ${{ steps.checks.outcome }}
          SELECTED: ${{ steps.scope.outputs.selected }}
          CANDIDATE_SHA: ${{ steps.scope.outputs.candidate_sha }}
          TESTED_SHA: ${{ steps.checks.outputs.tested_sha }}
        run: python3 src/aw/scripts/check.py required
