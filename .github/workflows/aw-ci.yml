name: CI / AW

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'src/aw/**'
      - 'providers/**'
      - 'src/tokenless/**'
      - '.github/workflows/aw-preview.yml'
      - '.github/workflows/aw-ci.yml'
  pull_request:
    paths:
      - '.github/workflows/aw-ci.yml'
      - 'src/aw/**'
      - 'providers/**'
      - 'src/tokenless/**'
      - '.github/workflows/aw-preview.yml'
  merge_group:
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the nightly suites on this exact workflow commit
        type: boolean
        default: false
      credential_free:
        description: Validate an unmerged fork without hosted-model credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    uses: ./.github/workflows/aw-preview.yml
    with:
      candidate_sha: ${{ github.sha }}
      credential_free: ${{ inputs.credential_free }}
    secrets:
      QODER_PERSONAL_ACCESS_TOKEN: ${{ !inputs.credential_free && secrets.QODER_PERSONAL_ACCESS_TOKEN || '' }}

  scope:
    name: AW / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
      tokenless: ${{ steps.scope.outputs.tokenless }}
      candidate_sha: ${{ steps.scope.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /src/aw/scripts/check.py
            /src/aw/tests/test_ci_checks.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the gate and select AW changes
        id: scope
        run: python3 src/aw/scripts/check.py scope

  checks:
    name: AW / contract checks
    needs: scope
    if: needs.scope.outputs.selected == 'true'
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    outputs:
      tested_sha: ${{ steps.checks.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Migration acceptance builds the pinned historical installer.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Prepare the pinned Rust toolchain
        working-directory: src/aw
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: aw-checks
          workspaces: |
            src/aw
            providers/agent-sec-core
            providers/tokenless
          # Main warms the dependency cache; PRs avoid uploading disposable caches.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Run AW checks
        id: checks
        run: python3 src/aw/scripts/check.py

  tokenless:
    name: AW / Tokenless compatibility
    needs: scope
    if: needs.scope.outputs.tokenless == 'true'
    runs-on: >-
      ${{ github.repository == 'agentic-os-org/ANOLISA' &&
      'anolisa-k8s-general-ci-x64' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    outputs:
      tested_sha: ${{ steps.tokenless.outputs.tested_sha }}
    steps:
      - name: Select isolated Tokenless evidence
        run: echo "AW_TOKENLESS_EVIDENCE=$RUNNER_TEMP/aw-tokenless-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Prepare the pinned Rust toolchain
        working-directory: src/aw
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: aw-tokenless
          workspaces: |
            src/aw
            providers/tokenless
            src/tokenless
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Validate real Tokenless and RTK consumer contracts
        id: tokenless
        run: python3 -B src/aw/scripts/check_tokenless.py --output "$AW_TOKENLESS_EVIDENCE"
      - uses: actions/upload-artifact@v4
        if: always() && steps.tokenless.outcome != '' && steps.tokenless.outcome != 'skipped'
        with:
          name: aw-tokenless-compatibility-${{ github.sha }}
          path: |
            ${{ env.AW_TOKENLESS_EVIDENCE }}/*.json
            ${{ env.AW_TOKENLESS_EVIDENCE }}/*.jsonl
            ${{ env.AW_TOKENLESS_EVIDENCE }}/*.log
          retention-days: 7
          if-no-files-found: error

  required:
    name: AW / required
    needs: [scope, checks, tokenless]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /src/aw/scripts/check.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require the expected result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SELECTED: ${{ needs.scope.outputs.selected }}
          CANDIDATE_SHA: ${{ needs.scope.outputs.candidate_sha }}
          TESTED_SHA: ${{ needs.checks.outputs.tested_sha }}
          TOKENLESS_SELECTED: ${{ needs.scope.outputs.tokenless }}
          TOKENLESS_RESULT: ${{ needs.tokenless.result }}
          TOKENLESS_TESTED_SHA: ${{ needs.tokenless.outputs.tested_sha }}
        run: python3 src/aw/scripts/check.py required
