name: CI / sec-core Source Build

on:
  pull_request:
    branches:
      - main
      - 'release/agent-sec-core/**'
    paths:
      - 'src/agent-sec-core/**'
      - 'providers/agent-sec-core/**'
      - 'scripts/build-all.sh'
      - 'scripts/lib/**'
      - '.github/workflows/sec-core-source-code-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            container: ''
          - name: Alinux4
            container: alibaba-cloud-linux-4-registry.cn-hangzhou.cr.aliyuncs.com/alinux4/alinux4:latest
    name: Source Build (${{ matrix.name }})
    runs-on: anolisa-k8s-general-ci-x64
    container: ${{ matrix.container || '' }}
    steps:
      - name: Configure mirrors and install base tools (Alinux4)
        if: matrix.container != ''
        run: |
          sed -i -e "s/cloud.aliyuncs/aliyun/g" /etc/yum.repos.d/*.repo
          dnf install -y tar git sudo bubblewrap gnupg2 jq
          # Fix sudo PAM in container: replace with permissive config
          cat > /etc/pam.d/sudo <<'EOF'
          #%PAM-1.0
          auth       sufficient   pam_rootok.so
          account    sufficient   pam_permit.so
          session    sufficient   pam_permit.so
          EOF
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expose Node.js in the system PATH
        run: |
          node_backup="${RUNNER_TEMP}/anolisa-system-node-backup"
          if sudo test -e /usr/local/bin/node || sudo test -L /usr/local/bin/node; then
            sudo mv /usr/local/bin/node "$node_backup"
          fi
          restore_node() {
            sudo rm -f /usr/local/bin/node
            if sudo test -e "$node_backup" || sudo test -L "$node_backup"; then
              sudo mv "$node_backup" /usr/local/bin/node
            fi
          }
          trap restore_node ERR
          sudo ln -s "$(command -v node)" /usr/local/bin/node
          PATH=/usr/local/bin:/usr/bin:/bin node --version
          echo "ANOLISA_NODE_BACKUP=${node_backup}" >> "$GITHUB_ENV"
          trap - ERR
      - name: Install runtime dependencies (Ubuntu 22.04)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gnupg jq
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt, rust-src
      - name: Build and install
        run: |
          build_status=0
          ./scripts/build-all.sh --component sec-core --prefix /usr || build_status=$?
          if (( build_status != 0 )); then
            echo "::group::sec-core build failure log"
            tail -n 200 target/build-all/build.log 2>/dev/null || echo "target/build-all/build.log is unavailable"
            echo "::endgroup::"
            exit "$build_status"
          fi
      - name: Verify CLI
        run: |
          agent-sec-cli --version
          agent-sec-cli --help
          agent-sec-cli scan-code --help >/dev/null
          agent-sec-cli scan-pii --help >/dev/null
          agent-sec-cli scan-prompt --help >/dev/null
          agent-sec-cli observability record --help >/dev/null
          agent-sec-cli events --help >/dev/null
          agent-sec-cli skill-ledger check --help >/dev/null
          agent-sec-cli skill-ledger scan --help >/dev/null
          for retired in harden verify; do
            if agent-sec-cli "$retired" --help >/dev/null 2>&1; then
              echo "ERROR: $retired is retired in the V2 CLI" >&2
              exit 1
            fi
          done
      - name: Verify daemon
        run: agent-sec-daemon --help
      - name: Verify V2 source runtime
        run: |
          test -x /usr/bin/agent-sec-cli
          test -x /usr/bin/agent-sec-daemon
          test -x /usr/bin/agent-sec-daemon-health
          test -f /usr/lib/systemd/system/agent-sec-core.service
          grep -Fx 'ExecStart="/usr/bin/agent-sec-daemon" serve --skillsec-config "/etc/agent-sec/skillsec.json"' /usr/lib/systemd/system/agent-sec-core.service
          test ! -e "$HOME/.local/lib/anolisa/sec-core/venv"
          test ! -e "$HOME/.local/bin/agent-sec-cli"
          test ! -e "$HOME/.local/bin/agent-sec-daemon"
          test ! -e /usr/lib/systemd/user/agent-sec-core.service
      - name: Start and verify installed V2 system service
        run: |
          if [[ -d /run/systemd/system ]]; then
            trap 'sudo systemctl stop agent-sec-core.service' EXIT
            sudo systemctl daemon-reload
            sudo systemctl start agent-sec-core.service
            sudo systemctl is-active --quiet agent-sec-core.service
            # Type=simple becomes active before the daemon binds its RPC socket.
            if ! sudo timeout --kill-after=5s 30s bash -c '
              until env AGENT_SEC_DAEMON_SOCKET=/run/agent-sec-core/daemon.sock \
                  AGENT_SEC_HEALTH_TIMEOUT_SECONDS=2 /usr/bin/agent-sec-daemon-health; do
                sleep 0.2
              done
            '; then
              sudo journalctl -u agent-sec-core.service --no-pager -n 100 >&2 || true
              exit 1
            fi
          fi
      - name: Verify sandbox
        run: linux-sandbox --help
      - name: Verify runtime dependencies
        run: |
          sec_runtime_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PATH="$sec_runtime_path" bwrap --version
          if PATH="$sec_runtime_path" command -v gpg >/dev/null; then
            PATH="$sec_runtime_path" gpg --version
          else
            PATH="$sec_runtime_path" gpg2 --version
          fi
          PATH="$sec_runtime_path" node --version
          PATH="$sec_runtime_path" jq --version
      - name: Verify deployment
        run: |
          echo "=== Skills ==="
          ls /usr/share/anolisa/skills/
          echo "=== Cosh Extension ==="
          ls /usr/share/anolisa/extensions/agent-sec-core/
          ls /usr/share/anolisa/extensions/agent-sec-core/hooks/
          echo "=== OpenClaw Plugin ==="
          ls /usr/share/anolisa/agent-sec-core/adapters/openclaw/
          ls /usr/share/anolisa/agent-sec-core/adapters/openclaw/dist/
          ls /usr/share/anolisa/agent-sec-core/adapters/openclaw/scripts/
          test -x /usr/share/anolisa/agent-sec-core/adapters/openclaw/scripts/deploy.sh
          echo "=== Hermes Plugin ==="
          ls /usr/share/anolisa/agent-sec-core/adapters/hermes/src/
          ls /usr/share/anolisa/agent-sec-core/adapters/hermes/src/plugin.yaml
          ls /usr/share/anolisa/agent-sec-core/adapters/hermes/scripts/deploy.sh
          test -x /usr/share/anolisa/agent-sec-core/adapters/hermes/scripts/deploy.sh
          echo "=== Codex Plugin ==="
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/hooks/
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/hooks/code_scanner_hook.py
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/hooks/skill_ledger_hook.py
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/.codex-plugin/plugin.json
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/install.sh
          test -x /usr/share/anolisa/agent-sec-core/adapters/codex/install.sh
          ls /usr/share/anolisa/agent-sec-core/adapters/codex/.agents/plugins/marketplace.json
          echo "=== V2 source runtime ==="
          test -x /usr/bin/agent-sec-cli
          test -x /usr/bin/agent-sec-daemon
          test -x /usr/bin/agent-sec-daemon-health
          test ! -e ~/.local/lib/anolisa/sec-core/venv
      - name: Start V2 daemon for source E2E
        run: |
          runtime_dir="$(sudo mktemp -d /tmp/agent-sec-core-ci.XXXXXX)"
          data_dir="${runtime_dir}/data"
          daemon_log="${RUNNER_TEMP}/agent-sec-daemon.log"
          daemon_pid="${RUNNER_TEMP}/agent-sec-daemon.pid"
          socket="${runtime_dir}/daemon.sock"
          sudo install -d -m 0700 "$data_dir"
          sudo env AGENT_SEC_DATA_DIR="$data_dir" agent-sec-daemon --socket "$socket" >"$daemon_log" 2>&1 &
          echo $! >"$daemon_pid"
          echo "AGENT_SEC_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_SOCKET=$socket" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_LOG=$daemon_log" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_PID=$daemon_pid" >> "$GITHUB_ENV"
          startup_deadline=$((SECONDS + 30))
          while (( SECONDS < startup_deadline )); do
            if ! sudo kill -0 "$(cat "$daemon_pid")" 2>/dev/null; then
              echo "agent-sec-daemon exited before accepting connections" >&2
              cat "$daemon_log" >&2
              exit 1
            fi
            if sudo python3 - "$socket" <<'PY'
          import socket
          import sys
          try:
              connection = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              connection.settimeout(0.1)
              connection.connect(sys.argv[1])
              connection.close()
          except OSError:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 0.05
          done
          echo "agent-sec-daemon did not accept connections" >&2
          cat "$daemon_log" >&2
          exit 1
      # Python and uv are test-only dependencies, installed after the V2 build.
      - name: Prepare V2 E2E test runner
        uses: astral-sh/setup-uv@v8.0.0
      - name: Run V2 E2E tests
        run: |
          # Installed-layout E2E fixtures retain their adapter names below /opt.
          # Every fixture points to files installed by the public Makefile.
          test ! -e /opt/agent-sec && test ! -L /opt/agent-sec
          sudo install -d -m 0755 /opt/agent-sec
          trap 'sudo rm -rf /opt/agent-sec' EXIT
          adapter_root=/usr/share/anolisa/agent-sec-core/adapters
          for mapping in codex:codex-plugin qoder:qoder-plugin \
              qwencode:qwen-code-extension hermes:hermes-plugin openclaw:openclaw-plugin; do
            adapter="${mapping%%:*}"
            fixture="${mapping#*:}"
            test -d "$adapter_root/$adapter"
            sudo ln -s "$adapter_root/$adapter" "/opt/agent-sec/$fixture"
          done
          test -d /usr/share/anolisa/extensions/agent-sec-core/hooks
          sudo ln -s /usr/share/anolisa/extensions/agent-sec-core /opt/agent-sec/cosh-extension
          sudo env "PATH=$PATH" "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" \
            "AGENT_SEC_DATA_DIR=$AGENT_SEC_DATA_DIR" \
            "AGENT_SEC_DAEMON_SOCKET=$AGENT_SEC_DAEMON_SOCKET" \
            PII_HOOK_ASSET_ROOT=/opt/agent-sec \
            PII_COSH_HOOK_DIR=/usr/share/anolisa/extensions/agent-sec-core/hooks \
            uv run --python 3.11.6 --no-project --with pytest --with pyyaml make -C src/agent-sec-core test-e2e-source-build-v2
      - name: Show V2 daemon log after E2E failure
        if: failure()
        run: test -f "$AGENT_SEC_DAEMON_LOG" && cat "$AGENT_SEC_DAEMON_LOG" || true
      - name: Stop V2 daemon after E2E tests
        if: always()
        run: |
          if test -f "$AGENT_SEC_DAEMON_PID"; then
            pid="$(cat "$AGENT_SEC_DAEMON_PID")"
            sudo kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Run V2 policy crash consistency tests
        working-directory: src/agent-sec-core/v2
        run: >-
          cargo test --locked -p asc-policy-repository-sqlite
          --features fault-injection --test crash_recovery
          --target-dir target/fault-injection -- --nocapture
      - name: Restore system Node.js
        if: always()
        run: |
          [[ -n "${ANOLISA_NODE_BACKUP:-}" ]] || exit 0
          sudo rm -f /usr/local/bin/node
          if sudo test -e "$ANOLISA_NODE_BACKUP" || sudo test -L "$ANOLISA_NODE_BACKUP"; then
            sudo mv "$ANOLISA_NODE_BACKUP" /usr/local/bin/node
          fi

  system-build:
    name: Source Build System Install (Ubuntu 22.04)
    runs-on: anolisa-k8s-general-ci-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expose Node.js in the system PATH
        run: |
          node_backup="${RUNNER_TEMP}/anolisa-system-node-backup"
          if sudo test -e /usr/local/bin/node || sudo test -L /usr/local/bin/node; then
            sudo mv /usr/local/bin/node "$node_backup"
          fi
          restore_node() {
            sudo rm -f /usr/local/bin/node
            if sudo test -e "$node_backup" || sudo test -L "$node_backup"; then
              sudo mv "$node_backup" /usr/local/bin/node
            fi
          }
          trap restore_node ERR
          sudo ln -s "$(command -v node)" /usr/local/bin/node
          PATH=/usr/local/bin:/usr/bin:/bin node --version
          echo "ANOLISA_NODE_BACKUP=${node_backup}" >> "$GITHUB_ENV"
          trap - ERR
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt, rust-src
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y passwd util-linux
      - name: Build and install in system mode
        run: |
          build_status=0
          ./scripts/build-all.sh --component sec-core --system --prefix /usr || build_status=$?
          if (( build_status != 0 )); then
            echo "::group::sec-core build failure log"
            tail -n 200 target/build-all/build.log 2>/dev/null || echo "target/build-all/build.log is unavailable"
            echo "::endgroup::"
            exit "$build_status"
          fi
      - name: Verify system commands
        run: |
          agent-sec-cli --version
          agent-sec-cli --help
          agent-sec-cli scan-code --help >/dev/null
          agent-sec-cli scan-pii --help >/dev/null
          agent-sec-cli scan-prompt --help >/dev/null
          agent-sec-cli observability record --help >/dev/null
          agent-sec-cli events --help >/dev/null
          agent-sec-cli skill-ledger check --help >/dev/null
          agent-sec-cli skill-ledger scan --help >/dev/null
          for retired in harden verify; do
            if agent-sec-cli "$retired" --help >/dev/null 2>&1; then
              echo "ERROR: $retired is retired in the V2 CLI" >&2
              exit 1
            fi
          done
          agent-sec-daemon --help
          linux-sandbox --help
      - name: Verify runtime dependencies
        run: |
          sec_runtime_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PATH="$sec_runtime_path" bwrap --version
          if PATH="$sec_runtime_path" command -v gpg >/dev/null; then
            PATH="$sec_runtime_path" gpg --version
          else
            PATH="$sec_runtime_path" gpg2 --version
          fi
          PATH="$sec_runtime_path" node --version
          PATH="$sec_runtime_path" jq --version
      - name: Verify system deployment
        run: |
          echo "=== System binaries ==="
          test -x /usr/bin/agent-sec-cli
          test -x /usr/bin/agent-sec-daemon
          test -x /usr/bin/agent-sec-daemon-health
          test -x /usr/bin/linux-sandbox
          echo "=== Cosh Extension ==="
          test -d /usr/share/anolisa/extensions/agent-sec-core/hooks
          echo "=== OpenClaw Plugin ==="
          test -d /usr/share/anolisa/agent-sec-core/adapters/openclaw/dist
          test -x /usr/share/anolisa/agent-sec-core/adapters/openclaw/scripts/deploy.sh
          echo "=== Hermes Plugin ==="
          test -f /usr/share/anolisa/agent-sec-core/adapters/hermes/src/plugin.yaml
          test -x /usr/share/anolisa/agent-sec-core/adapters/hermes/scripts/deploy.sh
          echo "=== Codex Plugin ==="
          test -f /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/hooks/code_scanner_hook.py
          test -f /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/hooks/skill_ledger_hook.py
          test -f /usr/share/anolisa/agent-sec-core/adapters/codex/hooks-plugin/.codex-plugin/plugin.json
          test -x /usr/share/anolisa/agent-sec-core/adapters/codex/install.sh
          test -f /usr/share/anolisa/agent-sec-core/adapters/codex/.agents/plugins/marketplace.json
          echo "=== Skills ==="
          test -d /usr/share/anolisa/skills
          echo "=== V2 system service ==="
          test -f /usr/lib/systemd/system/agent-sec-core.service
          grep -Fx 'ExecStart="/usr/bin/agent-sec-daemon" serve --skillsec-config "/etc/agent-sec/skillsec.json"' /usr/lib/systemd/system/agent-sec-core.service
          test ! -e /usr/share/anolisa/agent-sec-core/venv
          test ! -e /usr/lib/systemd/user/agent-sec-core.service
      - name: Start and verify installed V2 system service
        run: |
          if [[ -d /run/systemd/system ]]; then
            trap 'sudo systemctl stop agent-sec-core.service' EXIT
            sudo systemctl daemon-reload
            sudo systemctl start agent-sec-core.service
            sudo systemctl is-active --quiet agent-sec-core.service
            # Type=simple becomes active before the daemon binds its RPC socket.
            if ! sudo timeout --kill-after=5s 30s bash -c '
              until env AGENT_SEC_DAEMON_SOCKET=/run/agent-sec-core/daemon.sock \
                  AGENT_SEC_HEALTH_TIMEOUT_SECONDS=2 /usr/bin/agent-sec-daemon-health; do
                sleep 0.2
              done
            '; then
              sudo journalctl -u agent-sec-core.service --no-pager -n 100 >&2 || true
              exit 1
            fi
          fi
      - name: Verify system install as regular user
        run: |
          sudo useradd -m -s /bin/bash secprobe || true
          sudo -u secprobe env PATH=/usr/local/bin:/usr/bin:/bin node --version
          sudo -u secprobe /usr/bin/agent-sec-cli --version
          sudo -u secprobe /usr/bin/agent-sec-cli scan-code --help >/dev/null
      - name: Start V2 daemon for source E2E
        run: |
          runtime_dir="$(sudo mktemp -d /tmp/agent-sec-core-ci.XXXXXX)"
          data_dir="${runtime_dir}/data"
          daemon_log="${RUNNER_TEMP}/agent-sec-daemon.log"
          daemon_pid="${RUNNER_TEMP}/agent-sec-daemon.pid"
          socket="${runtime_dir}/daemon.sock"
          sudo install -d -m 0700 "$data_dir"
          sudo env AGENT_SEC_DATA_DIR="$data_dir" agent-sec-daemon --socket "$socket" >"$daemon_log" 2>&1 &
          echo $! >"$daemon_pid"
          echo "AGENT_SEC_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_SOCKET=$socket" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_LOG=$daemon_log" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_PID=$daemon_pid" >> "$GITHUB_ENV"
          startup_deadline=$((SECONDS + 30))
          while (( SECONDS < startup_deadline )); do
            if ! sudo kill -0 "$(cat "$daemon_pid")" 2>/dev/null; then
              echo "agent-sec-daemon exited before accepting connections" >&2
              cat "$daemon_log" >&2
              exit 1
            fi
            if sudo python3 - "$socket" <<'PY'
          import socket
          import sys
          try:
              connection = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              connection.settimeout(0.1)
              connection.connect(sys.argv[1])
              connection.close()
          except OSError:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 0.05
          done
          echo "agent-sec-daemon did not accept connections" >&2
          cat "$daemon_log" >&2
          exit 1
      # Python and uv are test-only dependencies, installed after the V2 build.
      - name: Prepare V2 E2E test runner
        uses: astral-sh/setup-uv@v8.0.0
      - name: Run V2 E2E tests
        run: |
          # Installed-layout E2E fixtures retain their adapter names below /opt.
          # Every fixture points to files installed by the public Makefile.
          test ! -e /opt/agent-sec && test ! -L /opt/agent-sec
          sudo install -d -m 0755 /opt/agent-sec
          trap 'sudo rm -rf /opt/agent-sec' EXIT
          adapter_root=/usr/share/anolisa/agent-sec-core/adapters
          for mapping in codex:codex-plugin qoder:qoder-plugin \
              qwencode:qwen-code-extension hermes:hermes-plugin openclaw:openclaw-plugin; do
            adapter="${mapping%%:*}"
            fixture="${mapping#*:}"
            test -d "$adapter_root/$adapter"
            sudo ln -s "$adapter_root/$adapter" "/opt/agent-sec/$fixture"
          done
          test -d /usr/share/anolisa/extensions/agent-sec-core/hooks
          sudo ln -s /usr/share/anolisa/extensions/agent-sec-core /opt/agent-sec/cosh-extension
          sudo env "PATH=$PATH" "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" \
            "AGENT_SEC_DATA_DIR=$AGENT_SEC_DATA_DIR" \
            "AGENT_SEC_DAEMON_SOCKET=$AGENT_SEC_DAEMON_SOCKET" \
            PII_HOOK_ASSET_ROOT=/opt/agent-sec \
            PII_COSH_HOOK_DIR=/usr/share/anolisa/extensions/agent-sec-core/hooks \
            uv run --python 3.11.6 --no-project --with pytest --with pyyaml make -C src/agent-sec-core test-e2e-source-build-v2
      - name: Show V2 daemon log after E2E failure
        if: failure()
        run: test -f "$AGENT_SEC_DAEMON_LOG" && cat "$AGENT_SEC_DAEMON_LOG" || true
      - name: Stop V2 daemon after E2E tests
        if: always()
        run: |
          if test -f "$AGENT_SEC_DAEMON_PID"; then
            pid="$(cat "$AGENT_SEC_DAEMON_PID")"
            sudo kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Restore system Node.js
        if: always()
        run: |
          [[ -n "${ANOLISA_NODE_BACKUP:-}" ]] || exit 0
          sudo rm -f /usr/local/bin/node
          if sudo test -e "$ANOLISA_NODE_BACKUP" || sudo test -L "$ANOLISA_NODE_BACKUP"; then
            sudo mv "$ANOLISA_NODE_BACKUP" /usr/local/bin/node
          fi
