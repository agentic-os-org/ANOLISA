name: CI / sec-core Source Build

on:
  pull_request:
    branches:
      - main
      - 'release/agent-sec-core/**'
    paths:
      - 'src/agent-sec-core/**'
      - 'scripts/build-all.sh'
      - '.github/workflows/sec-core-source-code-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            container: ''
          - name: Alinux4
            container: alibaba-cloud-linux-4-registry.cn-hangzhou.cr.aliyuncs.com/alinux4/alinux4:latest
    name: Source Build (${{ matrix.name }})
    runs-on: anolisa-k8s-general-ci-x64
    container: ${{ matrix.container || '' }}
    steps:
      - name: Configure mirrors and install base tools (Alinux4)
        if: matrix.container != ''
        run: |
          sed -i -e "s/cloud.aliyuncs/aliyun/g" /etc/yum.repos.d/*.repo
          dnf install -y tar git sudo bubblewrap gnupg2 jq
          # Fix sudo PAM in container: replace with permissive config
          cat > /etc/pam.d/sudo <<'EOF'
          #%PAM-1.0
          auth       sufficient   pam_rootok.so
          account    sufficient   pam_permit.so
          session    sufficient   pam_permit.so
          EOF
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expose Node.js in the system PATH
        run: |
          node_backup="${RUNNER_TEMP}/anolisa-system-node-backup"
          if sudo test -e /usr/local/bin/node || sudo test -L /usr/local/bin/node; then
            sudo mv /usr/local/bin/node "$node_backup"
          fi
          restore_node() {
            sudo rm -f /usr/local/bin/node
            if sudo test -e "$node_backup" || sudo test -L "$node_backup"; then
              sudo mv "$node_backup" /usr/local/bin/node
            fi
          }
          trap restore_node ERR
          sudo ln -s "$(command -v node)" /usr/local/bin/node
          PATH=/usr/local/bin:/usr/bin:/bin node --version
          echo "ANOLISA_NODE_BACKUP=${node_backup}" >> "$GITHUB_ENV"
          trap - ERR
      - name: Install runtime dependencies (Ubuntu 22.04)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gnupg jq
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt, rust-src
      - name: Build and install
        run: |
          build_status=0
          ./scripts/build-all.sh --component sec-core || build_status=$?
          if (( build_status != 0 )); then
            echo "::group::sec-core build failure log"
            tail -n 200 target/build.log 2>/dev/null || echo "target/build.log is unavailable"
            echo "::endgroup::"
            exit "$build_status"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify CLI
        run: |
          agent-sec-cli --version
          agent-sec-cli --help
      - name: Verify daemon
        run: agent-sec-daemon --help
      - name: Verify V2 source runtime
        run: |
          test -x /usr/local/bin/agent-sec-cli
          test -x /usr/local/bin/agent-sec-daemon
          test -f /etc/systemd/system/agent-sec-core.service
          grep -Fx 'ExecStart="/usr/local/bin/agent-sec-daemon" serve' /etc/systemd/system/agent-sec-core.service
          test ! -e "$HOME/.local/lib/anolisa/sec-core/venv"
          test ! -e "$HOME/.local/bin/agent-sec-cli"
          test ! -e "$HOME/.local/bin/agent-sec-daemon"
          test ! -e /usr/lib/systemd/user/agent-sec-core.service
          if [[ -d /run/systemd/system ]]; then
            sudo systemctl is-active --quiet agent-sec-core.service
          fi
      - name: Verify sandbox
        run: linux-sandbox --help
      - name: Verify runtime dependencies
        run: |
          sec_runtime_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PATH="$sec_runtime_path" bwrap --version
          if PATH="$sec_runtime_path" command -v gpg >/dev/null; then
            PATH="$sec_runtime_path" gpg --version
          else
            PATH="$sec_runtime_path" gpg2 --version
          fi
          PATH="$sec_runtime_path" node --version
          PATH="$sec_runtime_path" jq --version
      - name: Verify deployment
        run: |
          echo "=== Skills ==="
          ls ~/.copilot-shell/skills/
          echo "=== Cosh Extension ==="
          ls ~/.copilot-shell/extensions/agent-sec-core/
          ls ~/.copilot-shell/extensions/agent-sec-core/hooks/
          echo "=== OpenClaw Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/dist/
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/scripts/
          test -x ~/.local/lib/anolisa/sec-core/openclaw-plugin/scripts/deploy.sh
          echo "=== Hermes Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/src/
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/src/plugin.yaml
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/scripts/deploy.sh
          test -x ~/.local/lib/anolisa/sec-core/hermes-plugin/scripts/deploy.sh
          echo "=== Codex Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/code_scanner_hook.py
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/skill_ledger_hook.py
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/.codex-plugin/plugin.json
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/install.sh
          test -x ~/.local/lib/anolisa/sec-core/codex-plugin/install.sh
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/.agents/plugins/marketplace.json
          echo "=== V2 source runtime ==="
          test -x /usr/local/bin/agent-sec-cli
          test -x /usr/local/bin/agent-sec-daemon
          test ! -e ~/.local/lib/anolisa/sec-core/venv
      - name: Start V2 daemon for source E2E
        run: |
          runtime_dir="$(mktemp -d /tmp/agent-sec-core-ci.XXXXXX)"
          data_dir="${runtime_dir}/data"
          daemon_log="${RUNNER_TEMP}/agent-sec-daemon.log"
          daemon_pid="${RUNNER_TEMP}/agent-sec-daemon.pid"
          socket="${runtime_dir}/daemon.sock"
          mkdir -p "$data_dir"
          chmod 0700 "$runtime_dir" "$data_dir"
          AGENT_SEC_DATA_DIR="$data_dir" agent-sec-daemon --socket "$socket" >"$daemon_log" 2>&1 &
          echo $! >"$daemon_pid"
          echo "AGENT_SEC_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_SOCKET=$socket" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_LOG=$daemon_log" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_PID=$daemon_pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 100); do
            if ! kill -0 "$(cat "$daemon_pid")" 2>/dev/null; then
              echo "agent-sec-daemon exited before accepting connections" >&2
              cat "$daemon_log" >&2
              exit 1
            fi
            if python3 - "$socket" <<'PY'
          import socket
          import sys
          try:
              connection = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              connection.settimeout(0.1)
              connection.connect(sys.argv[1])
              connection.close()
          except OSError:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 0.05
          done
          echo "agent-sec-daemon did not accept connections" >&2
          cat "$daemon_log" >&2
          exit 1
      - name: Run V2 E2E tests
        run: uv run --python 3.11.6 --no-project --with pytest --with pyyaml make -C src/agent-sec-core test-e2e-source-build-v2
      - name: Show V2 daemon log after E2E failure
        if: failure()
        run: test -f "$AGENT_SEC_DAEMON_LOG" && cat "$AGENT_SEC_DAEMON_LOG" || true
      - name: Stop V2 daemon after E2E tests
        if: always()
        run: |
          if test -f "$AGENT_SEC_DAEMON_PID"; then
            pid="$(cat "$AGENT_SEC_DAEMON_PID")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Restore system Node.js
        if: always()
        run: |
          [[ -n "${ANOLISA_NODE_BACKUP:-}" ]] || exit 0
          sudo rm -f /usr/local/bin/node
          if sudo test -e "$ANOLISA_NODE_BACKUP" || sudo test -L "$ANOLISA_NODE_BACKUP"; then
            sudo mv "$ANOLISA_NODE_BACKUP" /usr/local/bin/node
          fi

  system-build:
    name: Source Build System Install (Ubuntu 22.04)
    runs-on: anolisa-k8s-general-ci-x64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expose Node.js in the system PATH
        run: |
          node_backup="${RUNNER_TEMP}/anolisa-system-node-backup"
          if sudo test -e /usr/local/bin/node || sudo test -L /usr/local/bin/node; then
            sudo mv /usr/local/bin/node "$node_backup"
          fi
          restore_node() {
            sudo rm -f /usr/local/bin/node
            if sudo test -e "$node_backup" || sudo test -L "$node_backup"; then
              sudo mv "$node_backup" /usr/local/bin/node
            fi
          }
          trap restore_node ERR
          sudo ln -s "$(command -v node)" /usr/local/bin/node
          PATH=/usr/local/bin:/usr/bin:/bin node --version
          echo "ANOLISA_NODE_BACKUP=${node_backup}" >> "$GITHUB_ENV"
          trap - ERR
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt, rust-src
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y passwd util-linux
      - name: Build and install in system mode
        run: |
          build_status=0
          ./scripts/build-all.sh --component sec-core --system || build_status=$?
          if (( build_status != 0 )); then
            echo "::group::sec-core build failure log"
            tail -n 200 target/build.log 2>/dev/null || echo "target/build.log is unavailable"
            echo "::endgroup::"
            exit "$build_status"
          fi
      - name: Verify system commands
        run: |
          agent-sec-cli --version
          agent-sec-cli --help
          agent-sec-cli scan-code --help >/dev/null
          agent-sec-daemon --help
          linux-sandbox --help
      - name: Verify runtime dependencies
        run: |
          sec_runtime_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PATH="$sec_runtime_path" bwrap --version
          if PATH="$sec_runtime_path" command -v gpg >/dev/null; then
            PATH="$sec_runtime_path" gpg --version
          else
            PATH="$sec_runtime_path" gpg2 --version
          fi
          PATH="$sec_runtime_path" node --version
          PATH="$sec_runtime_path" jq --version
      - name: Verify system deployment
        run: |
          echo "=== System binaries ==="
          test -x /usr/local/bin/agent-sec-cli
          test -x /usr/local/bin/agent-sec-daemon
          test -x /usr/local/bin/linux-sandbox
          echo "=== Cosh Extension ==="
          test -d /usr/share/anolisa/extensions/agent-sec-core/hooks
          echo "=== OpenClaw Plugin ==="
          test -d /usr/local/lib/anolisa/sec-core/openclaw-plugin/dist
          test -x /usr/local/lib/anolisa/sec-core/openclaw-plugin/scripts/deploy.sh
          echo "=== Hermes Plugin ==="
          test -f /usr/local/lib/anolisa/sec-core/hermes-plugin/src/plugin.yaml
          test -x /usr/local/lib/anolisa/sec-core/hermes-plugin/scripts/deploy.sh
          echo "=== Codex Plugin ==="
          test -f /usr/local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/code_scanner_hook.py
          test -f /usr/local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/skill_ledger_hook.py
          test -f /usr/local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/.codex-plugin/plugin.json
          test -x /usr/local/lib/anolisa/sec-core/codex-plugin/install.sh
          test -f /usr/local/lib/anolisa/sec-core/codex-plugin/.agents/plugins/marketplace.json
          echo "=== Skills ==="
          test -d /usr/share/anolisa/skills
          echo "=== V2 system service ==="
          test -f /etc/systemd/system/agent-sec-core.service
          grep -Fx 'ExecStart="/usr/local/bin/agent-sec-daemon" serve' /etc/systemd/system/agent-sec-core.service
          test ! -e /usr/local/lib/anolisa/sec-core/venv
          test ! -e /usr/lib/systemd/user/agent-sec-core.service
      - name: Verify system install as regular user
        run: |
          sudo useradd -m -s /bin/bash secprobe || true
          sudo -u secprobe env PATH=/usr/local/bin:/usr/bin:/bin node --version
          sudo -u secprobe /usr/local/bin/agent-sec-cli --version
          sudo -u secprobe /usr/local/bin/agent-sec-cli scan-code --help >/dev/null
      - name: Start V2 daemon for source E2E
        run: |
          runtime_dir="$(mktemp -d /tmp/agent-sec-core-ci.XXXXXX)"
          data_dir="${runtime_dir}/data"
          daemon_log="${RUNNER_TEMP}/agent-sec-daemon.log"
          daemon_pid="${RUNNER_TEMP}/agent-sec-daemon.pid"
          socket="${runtime_dir}/daemon.sock"
          mkdir -p "$data_dir"
          chmod 0700 "$runtime_dir" "$data_dir"
          AGENT_SEC_DATA_DIR="$data_dir" agent-sec-daemon --socket "$socket" >"$daemon_log" 2>&1 &
          echo $! >"$daemon_pid"
          echo "AGENT_SEC_DATA_DIR=$data_dir" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_SOCKET=$socket" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_LOG=$daemon_log" >> "$GITHUB_ENV"
          echo "AGENT_SEC_DAEMON_PID=$daemon_pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 100); do
            if ! kill -0 "$(cat "$daemon_pid")" 2>/dev/null; then
              echo "agent-sec-daemon exited before accepting connections" >&2
              cat "$daemon_log" >&2
              exit 1
            fi
            if python3 - "$socket" <<'PY'
          import socket
          import sys
          try:
              connection = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              connection.settimeout(0.1)
              connection.connect(sys.argv[1])
              connection.close()
          except OSError:
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 0.05
          done
          echo "agent-sec-daemon did not accept connections" >&2
          cat "$daemon_log" >&2
          exit 1
      - name: Run V2 E2E tests
        run: uv run --python 3.11.6 --no-project --with pytest --with pyyaml make -C src/agent-sec-core test-e2e-source-build-v2
      - name: Show V2 daemon log after E2E failure
        if: failure()
        run: test -f "$AGENT_SEC_DAEMON_LOG" && cat "$AGENT_SEC_DAEMON_LOG" || true
      - name: Stop V2 daemon after E2E tests
        if: always()
        run: |
          if test -f "$AGENT_SEC_DAEMON_PID"; then
            pid="$(cat "$AGENT_SEC_DAEMON_PID")"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          fi
      - name: Restore system Node.js
        if: always()
        run: |
          [[ -n "${ANOLISA_NODE_BACKUP:-}" ]] || exit 0
          sudo rm -f /usr/local/bin/node
          if sudo test -e "$ANOLISA_NODE_BACKUP" || sudo test -L "$ANOLISA_NODE_BACKUP"; then
            sudo mv "$ANOLISA_NODE_BACKUP" /usr/local/bin/node
          fi
